<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bao Cross-Origin Frame Fixture (child)</title>
  <style>
    body { font: 13px system-ui; margin: 16px; background: #f7f7f9; }
    label { display: block; margin: 8px 0 2px; }
    input { width: 220px; padding: 5px; }
    button { margin-top: 12px; padding: 6px 14px; }
  </style>
</head>
<body>
  <!-- Stands in for a cross-origin payment frame's *routing*, not for T1.
       A card number / "Card number" label is masked and withheld at replay
       (test/sensitive.mjs). This field stays unmarked so the value can round-trip. -->
  <label for="note">Note</label>
  <input id="note" name="note" aria-label="Note" placeholder="hello" />
  <button data-testid="pay-btn" id="pay-btn">Pay</button>

  <script>
    window.__events = [];
    window.__fired = [];
    function record(kind, detail) { window.__events.push({ kind, detail }); }
    document.getElementById("note").addEventListener("input", (e) =>
      record("input", `note=${e.target.value}`));
    document.getElementById("pay-btn").addEventListener("click", () => {
      record("click", "pay-btn"); window.__fired.push({ id: "pay-btn", note: document.getElementById("note").value });
    });
  </script>
</body>
</html>
