<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trace</title>
  <link rel="icon" href="data:,">
  <style>
    /* The same tokens as index.html, so the trace view follows the window's theme. */
    :root {
      color-scheme: light;
      --bg: #f5f5f7; --side: #ececef; --card: #ffffff; --ink: #1d1d1f; --quiet: #6e6e73; --line: #d2d2d7;
      --accent: #0071e3; --select: #e8e8ed; --ok: #248a3d; --need: #c93400; --bad: #d70015; --bad-bg: #fdecea;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1c1e; --side: #2c2c2e; --card: #2c2c2e; --ink: #f5f5f7; --quiet: #98989d; --line: #3a3a3c;
      --accent: #0a84ff; --select: #3a3a3c; --ok: #30d158; --need: #ff9f0a; --bad: #ff453a; --bad-bg: #3a1614;
    }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    a { color: var(--accent); }
    code, pre { font-family: var(--mono); font-size: 12px; }
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; padding: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .empty { margin: 0; padding: 16px; color: var(--quiet); }
    .failed { color: var(--bad); }

    #trace { display: grid; grid-template-rows: auto auto minmax(0, 1fr); height: 100%; }
    #bar { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--card); }
    /* Bao's window draws its buttons over the page's top left, and a 212 by 52 strip there drags the window (bao-window.m). */
    [data-bao-native] #bar { min-height: 52px; padding-left: 224px; }
    #bar h1 { margin: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #bar .back { text-decoration: none; white-space: nowrap; }
    .status { padding: 1px 8px; border-radius: 999px; background: var(--select); color: var(--quiet); font-size: 12px; white-space: nowrap; }
    .status.passed { color: var(--ok); }
    .status.failed, .status.timed-out { color: var(--bad); background: var(--bad-bg); }

    #timeline { position: relative; height: 118px; margin: 0 12px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; -webkit-user-select: none; }
    #timeline .ticks { position: relative; height: 18px; color: var(--quiet); font-size: 11px; }
    #timeline .tick { position: absolute; top: 2px; padding-left: 4px; border-left: 1px solid var(--line); height: 116px; white-space: nowrap; pointer-events: none; }
    #timeline .film { display: flex; height: 60px; overflow: hidden; border-radius: 4px; background: var(--side); }
    #timeline .film > * { flex: 1 1 0; min-width: 0; height: 100%; object-fit: cover; object-position: top; border-right: 1px solid var(--bg); }
    #timeline .bars { position: relative; height: 28px; margin-top: 6px; }
    #timeline .bar { position: absolute; top: 0; height: 22px; min-width: 18px; padding: 0 4px; border-radius: 4px; background: var(--select); color: var(--ink); font-size: 11px; font-weight: 600; line-height: 22px; text-align: left; overflow: hidden; }
    #timeline .bar.failed { background: var(--bad-bg); color: var(--bad); }
    #timeline .bar.owner { background: repeating-linear-gradient(135deg, var(--select) 0 6px, transparent 6px 12px); box-shadow: inset 0 0 0 1px var(--line); }
    #timeline .bar[aria-current="true"] { background: var(--accent); color: #fff; box-shadow: none; }
    #timeline .cursor { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--need); pointer-events: none; }
    #timeline .preview { position: absolute; top: 100%; z-index: 2; width: 260px; margin: 4px 0 0 -130px; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); pointer-events: none; text-align: center; }
    #timeline .preview :is(video, img) { display: block; width: 100%; border-radius: 4px; }
    #timeline .preview span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    #timeline .preview .time { font: 11px var(--mono); color: var(--quiet); }

    main { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); min-height: 0; }
    #side { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; border-right: 1px solid var(--line); background: var(--card); }
    #side > :is(ol, dl) { overflow: auto; margin: 0; }
    .tabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); }
    .tabs button { padding: 7px 10px; border-bottom: 2px solid transparent; color: var(--quiet); white-space: nowrap; }
    .tabs button[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--ink); font-weight: 600; }
    .count { margin-left: 2px; padding: 0 6px; border-radius: 999px; background: var(--select); font-size: 11px; font-weight: 600; }
    .count.failed { background: var(--bad-bg); }
    #actions { list-style: none; padding: 0; }
    .action { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 0 6px; width: 100%; padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    .action[aria-current="true"] { background: var(--select); box-shadow: inset 3px 0 0 var(--accent); }
    .action .n, .action .took { color: var(--quiet); font: 11px/1.7 var(--mono); }
    .action .title { font-weight: 600; overflow-wrap: anywhere; }
    .action .why { grid-column: 2 / -1; color: var(--quiet); font-size: 12px; }
    .action.failed .title { color: var(--bad); }
    .action .mark { margin-right: 4px; }

    #detail { display: grid; grid-template: minmax(160px, 60%) minmax(0, 1fr) / minmax(0, 1fr); min-height: 0; }
    #snapshot { display: grid; grid-template: auto minmax(0, 1fr) / minmax(0, 1fr); min-height: 0; border-bottom: 1px solid var(--line); }
    .snapbar { display: flex; align-items: center; gap: 12px; background: var(--card); border-bottom: 1px solid var(--line); }
    .snapbar .tabs { border-bottom: 0; }
    .snapbar .where { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--quiet); font-size: 12px; }
    .snapbar .where strong { color: var(--ink); font-weight: 500; }
    .sources { display: flex; margin-right: 8px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .sources button { padding: 2px 8px; font-size: 12px; color: var(--quiet); }
    .sources button[aria-pressed="true"] { background: var(--select); color: var(--ink); font-weight: 600; }
    .stage { position: relative; min-height: 0; overflow: hidden; display: grid; place-items: center; container-type: size; }
    .shot { position: relative; line-height: 0; box-shadow: 0 0 0 1px var(--line); }
    .shot img { display: block; max-width: calc(100cqw - 16px); max-height: calc(100cqh - 16px); }
    .shot .target { position: absolute; border: 2px solid var(--accent); border-radius: 3px; background: color-mix(in srgb, var(--accent) 22%, transparent); pointer-events: none; }
    .shot .target::after { content: ""; position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: var(--bad); }
    .archive { position: absolute; top: 0; left: 0; border: 0; background: #fff; transform-origin: 0 0; }

    #tabs { display: grid; grid-template: auto minmax(0, 1fr) / minmax(0, 1fr); min-height: 0; background: var(--card); }
    .panel { overflow: auto; }
    .facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); align-content: start; gap: 4px 16px; margin: 0; padding: 10px 12px; }
    .facts dt { color: var(--quiet); }
    .facts dd { margin: 0; overflow-wrap: anywhere; }
    .facts p { margin: 0; }
    .lines { list-style: none; margin: 0; padding: 0; }
    .lines li { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: 12px; padding: 5px 12px; border-bottom: 1px solid var(--line); font: 12px/1.5 var(--mono); overflow-wrap: anywhere; }
    .lines .key { color: var(--quiet); }
    .lines li.failed .key { color: var(--bad); }
    .net-filter { display: block; width: 100%; padding: 5px 10px; border: 0; border-bottom: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; }
    .net { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
    .net th { position: sticky; top: 0; z-index: 1; padding: 5px 8px; background: var(--card); box-shadow: inset 0 -1px 0 var(--line); color: var(--quiet); font-weight: 500; text-align: left; }
    .net th:nth-child(n+2) { width: 92px; }
    .net td { padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .net .num { text-align: right; font-family: var(--mono); font-size: 11px; }
    .net tr[data-request] { cursor: pointer; }
    .net tr[data-request]:hover { background: var(--select); }
    .net em { color: var(--quiet); font-style: normal; }
    .request-row > td { padding: 0; white-space: normal; background: var(--bg); }
    .request { padding: 8px 12px 12px; }
    .request h4 { margin: 12px 0 4px; font-size: 12px; }
    .request .facts { padding: 0; font: 12px/1.5 var(--mono); }
    .request .full-url { margin: 0; font: 12px/1.5 var(--mono); overflow-wrap: anywhere; }
    .body-image { max-width: 320px; max-height: 240px; border: 1px solid var(--line); }
    [data-panel="page"], [data-panel="attachments"] { padding: 4px 12px 12px; }
    [data-panel="page"] h4 { margin: 12px 0 4px; font-size: 13px; }
    [data-panel="page"] p, [data-panel="attachments"] p { margin: 4px 0; }
    [data-panel="page"] details { margin: 4px 0; }
    .record-rows { margin: 6px 0 0; border: 1px solid var(--line); border-radius: 6px; }
    .record-row { display: grid; grid-template-columns: 9rem minmax(0, 1fr); column-gap: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    .record-row:last-child { border-bottom: 0; }
    .record-key, .record-facts, .record-links { color: var(--quiet); font-size: 12px; }
    .record-key { font-family: var(--mono); }
    .record-value { overflow-wrap: anywhere; }
    .record-facts, .record-links { display: block; }
    .receipt-file { margin-top: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; }
    .receipt-file span { display: block; overflow-wrap: anywhere; font: 12px/1.5 var(--mono); }
    .receipt-file-facts { color: var(--quiet); }

    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; grid-template-rows: 180px minmax(0, 1fr); }
      #side { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div id="trace"><p class="empty">Loading the trace…</p></div>
  <script src="/trace.js"></script>
</body>
</html>
