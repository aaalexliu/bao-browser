<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bao</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --side: #ececee;
      --card: #ffffff;
      --ink: #1d1d1f;
      --quiet: #6e6e73;
      --line: #d2d2d7;
      --accent: #0071e3;
      --ok: #1d7a32;
      --bad: #b42318;
      --warn: #8a5a00;
      --warn-bg: #fff6e0;
      --select: #e8e8ed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.28rem 0.65rem;
      cursor: pointer;
    }
    button.primary { background: var(--ink); color: white; border-color: var(--ink); }
    button.link { border: 0; background: transparent; padding: 0; color: var(--accent); }
    button.on, #rail nav button.on { background: white; border-color: transparent; }
    #app { display: grid; grid-template-columns: 196px 1fr; min-height: 100vh; }
    #rail {
      background: var(--side);
      padding: 0.9rem 0.7rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      border-right: 1px solid var(--line);
    }
    #rail .brand { display: flex; align-items: center; justify-content: space-between; padding: 0.2rem 0.45rem 0.6rem; }
    #rail nav { display: flex; flex-direction: column; gap: 0.15rem; }
    #rail nav button {
      text-align: left;
      background: transparent;
      border-color: transparent;
      border-radius: 6px;
      padding: 0.35rem 0.5rem;
    }
    #rail nav button.on { background: white; }
    .rail-foot { margin-top: auto; padding: 0.6rem 0.45rem 0.2rem; color: var(--quiet); display: grid; gap: 0.28rem; }
    .channel { display: flex; align-items: center; gap: 0.4rem; }
    .count {
      min-width: 1.1rem;
      text-align: center;
      background: var(--warn);
      color: white;
      border-radius: 999px;
      font-size: 11px;
      padding: 0 0.3rem;
    }
    .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #c7c7cc; display: inline-block; }
    .dot.on { background: #ff3b30; }
    #content { min-width: 0; }
    #act { padding: 0.7rem 1rem 0; }
    #main { padding: 0.4rem 1rem 2rem; }
    h2, h3, h4 { font-weight: 600; letter-spacing: -0.01em; }
    h2 { font-size: 20px; margin: 0.4rem 0 0.7rem; }
    .quiet { color: var(--quiet); }
    .card, .why, #heal-detail, #run-viewer {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.85rem 0.95rem;
      margin: 0.6rem 0;
    }
    #act-bar {
      background: var(--warn-bg);
      border: 1px solid #f0d090;
      border-radius: 10px;
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.4rem;
    }
    #act-bar .kicker { margin: 0; font-weight: 650; color: var(--warn); letter-spacing: 0.01em; }
    #act-bar .instruction { margin: 0.25rem 0; font-size: 15px; }
    #act-bar .timeout { margin: 0.15rem 0 0.45rem; color: var(--quiet); }
    label { display: grid; gap: 0.25rem; margin: 0.45rem 0; }
    input, select, textarea {
      padding: 0.35rem 0.45rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      width: 100%;
    }
    .row { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
    .drop { outline: 1px dashed var(--line); border-radius: 8px; padding: 0.55rem; }
    .drop.over { outline-color: var(--accent); }
    .pass, .passed { color: var(--ok); }
    .fail, .failed, .paused { color: var(--bad); }
    .badge { display: inline-block; background: var(--ink); color: white; border-radius: 999px; padding: 0.05rem 0.45rem; font-size: 11px; }
    .quiet-badge { background: #e8e8ed; color: var(--ink); }
    .notice { background: var(--warn-bg); border: 1px solid #f0d090; border-radius: 8px; padding: 0.55rem 0.7rem; margin: 0.4rem 0; }
    pre { white-space: pre-wrap; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    table.grid, table.identity { width: 100%; border-collapse: collapse; background: white; }
    table.grid th, table.grid td, table.identity th, table.identity td {
      text-align: left;
      padding: 0.45rem 0.5rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    table.grid { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .split { display: grid; grid-template-columns: 220px 1fr; gap: 0.8rem; }
    .step-list { display: flex; flex-direction: column; gap: 0.2rem; }
    .step { text-align: left; background: transparent; }
    .step.on { background: var(--select); }
    .step em { color: var(--quiet); font-style: normal; margin-left: 0.3rem; }
    .bar { display: flex; gap: 3px; align-items: center; margin: 0.6rem 0; }
    .seg { height: 8px; flex: 1; border-radius: 99px; background: #e5e5ea; }
    .seg.passed { background: #34c759; }
    .seg.failed { background: #ff3b30; }
    .seg.paused { background: #ff9f0a; }
    .bar-count { color: var(--quiet); margin-left: 0.4rem; }
    img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; }
    .compare { position: relative; }
    .compare img { display: block; width: 100%; height: auto; }
    .compare img + img { position: absolute; inset: 0; }
    .timeline { position: relative; height: 28px; margin: 0.4rem 0; background: #efeff2; border-radius: 6px; }
    .marker { position: absolute; top: 2px; transform: translateX(-50%); min-width: 1.3rem; padding: 0.1rem 0.25rem; }
    .marker.failed { color: var(--bad); }
    #heal-row, .heal-row { display: block; width: 100%; text-align: left; margin: 0.25rem 0; }
    details { margin: 0.4rem 0; }
    @media (max-width: 800px) {
      #app { grid-template-columns: 1fr; }
      .split { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="rail"></aside>
    <div id="content">
      <div id="act"></div>
      <main id="main"></main>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
