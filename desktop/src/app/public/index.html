<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bao</title>
  <style>
    [hidden] { display: none !important; }
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --side: #ececef;
      --card: #ffffff;
      --ink: #1d1d1f;
      --quiet: #6e6e73;
      --line: #d2d2d7;
      --accent: #0071e3;
      --action-fill: #0073e6;
      --select: #e8e8ed;
      --ok: #248a3d;
      --ok-bg: #e7f6ec;
      --heal: #0a7ea4;
      --heal-bg: #e5f4f8;
      --prov: #8a5a00;
      --prov-bg: #fff4d6;
      --need: #c93400;
      --need-bg: #fff1e8;
      --bad: #d70015;
      --bad-bg: #fdecea;
      --warn-bg: #fff6e0;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      --radius: 12px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --text-xs: 11px;
      --text-sm: 12px;
      --text-md: 13px;
      --text-lg: 15px;
      --text-xl: 22px;
      --text-2xl: 28px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1c1e;
      --side: #2c2c2e;
      --card: #2c2c2e;
      --ink: #f5f5f7;
      --quiet: #98989d;
      --line: #3a3a3c;
      --accent: #0a84ff;
      --select: #3a3a3c;
      --ok: #30d158;
      --ok-bg: #16301f;
      --heal: #64d2ff;
      --heal-bg: #0e2a33;
      --prov: #ffd60a;
      --prov-bg: #332b0d;
      --need: #ff9f0a;
      --need-bg: #33240d;
      --bad: #ff453a;
      --bad-bg: #3a1614;
      --warn-bg: #33280f;
      --shadow: none;
    }
    * { box-sizing: border-box; }
    :is(#rail, #screen-list, #detail-bar, #sidebar-dialog, .skip-link, .runs-content, .workflows-content) {
      --bg: #ffffff;
      --side: rgba(234, 234, 238, .74);
      --side-quiet: #5e5e63;
      --side-select: rgba(0, 0, 0, .085);
      --accent-fill: #b9520a;
      --on-accent: #ffffff;
      --quiet: #6e6e73;
      --line: rgba(0, 0, 0, .1);
      --glyph-mark: #ffffff;
      --accent: #b9520a;
      --need: #0066d6;
      --need-bg: #eef5fd;
      --text-xs: 0.75rem;
      --text-sm: 0.75rem;
      --text-md: 0.8125rem;
      --text-lg: 0.9375rem;
      color: var(--ink);
      font-size: var(--text-md);
      -webkit-font-smoothing: antialiased;
    }
    [data-theme="dark"] :is(#rail, #screen-list, #detail-bar, #sidebar-dialog, .skip-link, .runs-content, .workflows-content) {
      --bg: #1e1e1e;
      --side: rgba(44, 44, 48, .72);
      --side-quiet: #a1a1a6;
      --side-select: rgba(255, 255, 255, .1);
      --card: #262628;
      --ink: #f2f2f7;
      --quiet: #a1a1a6;
      --line: rgba(255, 255, 255, .1);
      --glyph-mark: #1e1e1e;
      --accent: #f2913f;
      --need: #4da3ff;
      --need-bg: #14253a;
    }
    .skip-link { position: fixed; inset-block-start: -100px; inset-inline-start: 12px; z-index: 100; background: var(--bg); color: var(--ink); padding: 8px 12px; border: 2px solid var(--accent); border-radius: 6px; }
    .skip-link:focus { inset-block-start: 8px; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font: var(--text-md)/1.45 var(--font);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button, a.button {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      height: 32px;
      padding: 0 12px;
      cursor: pointer;
      font-size: var(--text-md);
    }
    a.button { display: inline-flex; align-items: center; color: inherit; text-decoration: none; }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .runs-content button.primary { background: var(--accent-fill); color: var(--on-accent); border-color: var(--accent-fill); }
    button.link { border: 0; background: transparent; padding: 0; height: auto; color: var(--accent); font-weight: 600; }
    button.toggle.on { background: var(--select); border-color: var(--accent); }
    button:disabled { opacity: 0.45; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    h2, h3, h4 { font-weight: 650; letter-spacing: -0.02em; }
    h2 { font-size: var(--text-xl); line-height: 1.2; margin: 0; }
    h3 { font-size: var(--text-lg); margin: 0; }
    h3.section { font-size: var(--text-md); margin: 1.1rem 0 0.45rem; }
    .lede, .meta, .quiet { color: var(--quiet); font-size: var(--text-sm); }
    .device { display: flex; justify-content: space-between; gap: 1rem; padding: 0.35rem 0; border-top: 1px solid var(--line); }
    .backup-row { display: flex; justify-content: space-between; gap: 1rem; align-items: end; }
    .backup-row label { min-width: 12rem; margin: 0; }
    .backup-copy { display: flex; flex-wrap: wrap; gap: 0.35rem 0.75rem; align-items: baseline; min-width: 0; }
    .backup-copy p { margin: 0; }
    .sync-cats { list-style: none; padding: 0; margin: 0.2rem 0 0.8rem; }
    .sync-cats li { padding: 0.45rem 0; border-top: 1px solid var(--line); }
    .sync-cats label { display: flex; align-items: center; gap: 0.5rem; margin: 0; font-weight: 600; }
    .sync-cats input { width: auto; }
    #remote-mcp-setting .remote-choice { display: flex; align-items: center; gap: 8px; }
    #remote-mcp { width: auto; flex: none; margin: 0; }
    #page-engine-settings .extensions-choice { display: flex; align-items: center; gap: 8px; }
    #chrome-profile-extensions { width: auto; }
    #agent-window-settings label { display: flex; align-items: center; gap: 8px; }
    #keep-agent-browser-open { width: auto; flex: none; margin: 0; }
    #settings { overflow-wrap: anywhere; }
    #settings :is(input, select) { min-width: 0; max-width: 100%; }
    .desktop-mcp-actions { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-block: var(--space-4); }
    .desktop-mcp-actions button { height: auto; min-height: 36px; padding-block: var(--space-2); }
    #desktop-mcp-settings p, #desktop-mcp-confirm p { max-width: 72ch; line-height: 1.5; }
    #desktop-mcp-settings :is([role="status"], [role="alert"]):empty { margin: 0; }
    #desktop-mcp-confirm { width: min(46rem, calc(100% - 24px)); max-height: calc(100dvh - 24px); margin: auto; padding: var(--space-5); border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink); background: var(--card); overflow: auto; overscroll-behavior: contain; }
    #desktop-mcp-confirm::backdrop { background: rgba(0, 0, 0, 0.35); }
    #desktop-mcp-confirm h2 { line-height: 1.4; }
    #desktop-mcp-confirm pre { white-space: pre-wrap; overflow-wrap: anywhere; font: var(--text-sm)/1.5 var(--mono); padding: var(--space-3); background: var(--bg); border-radius: 8px; }
    .desktop-mcp-path, #desktop-mcp-feedback { overflow-wrap: anywhere; }
    #desktop-mcp-settings button, #desktop-mcp-confirm button { border-color: var(--quiet); }
    #desktop-mcp-confirm button.primary { background: var(--action-fill); border-color: var(--action-fill); }
    @media (max-width: 500px) {
      #settings .backup-row { flex-wrap: wrap; }
      #settings .backup-row label { min-width: 0; }
      #desktop-mcp-confirm { padding: var(--space-4); }
    }
    .sync-cats p { margin: 0.2rem 0 0; color: var(--quiet); font-size: var(--text-sm); }
    .versions { list-style: none; padding: 0; margin: 0.4rem 0 0; display: grid; gap: 0.7rem; }
    .versions li { padding-top: 0.55rem; border-top: 1px solid var(--line); }
    #versions time { color: var(--quiet); font-size: var(--text-sm); }
    .locator-history { width: 100%; border-collapse: collapse; margin: 0.35rem 0 0; font-size: var(--text-sm); }
    .locator-history th, .locator-history td { text-align: left; font-weight: 500; padding: 0.2rem 0.55rem 0.2rem 0; color: var(--quiet); }
    .locator-history th { font-size: var(--text-xs); }
    .version-diff { margin: 0.35rem 0 0; }
    .conflict-banner { margin: 0.45rem 0 0; font-weight: 650; }
    .conflict-diff { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 0.45rem 0; }
    .conflict-diff h4 { margin: 0 0 0.35rem; font-size: var(--text-md); }
    .conflict-diff ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.35rem; }
    .conflict-diff li { display: grid; gap: 0.1rem; padding: 0.4rem 0.5rem; border-radius: 8px; background: transparent; border-top: 0; }
    .conflict-diff li span { color: var(--quiet); font-size: var(--text-sm); }
    .conflict-diff li[data-changed="true"] { outline: 1px solid var(--accent); background: var(--select); }
    .version-steps { margin: 0.35rem 0 0; }
    .version-steps summary { cursor: pointer; color: var(--quiet); }
    .version-steps ol { list-style: none; padding: 0; margin: 0.35rem 0 0; display: grid; gap: 0.35rem; }
    .version-steps li { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; padding-top: 0; border-top: 0; color: var(--quiet); font-size: var(--text-sm); }
    .version-steps li[data-changed="true"] { color: var(--ink); }
    .lede { font-size: var(--text-md); margin: 0.35rem 0 var(--space-4); }
    #content.workflows-content { --quiet: #6e6e73; --line: rgba(0, 0, 0, 0.1); --select: rgba(0, 0, 0, 0.055); --ok: #1e7b34; --heal: #08789d; --bad-bg: #fdf0f1; --workflow-zebra: #f4f5f5; background: var(--bg); line-height: 1.4; }
    [data-theme="dark"] #content.workflows-content { --quiet: #a1a1a6; --line: rgba(255, 255, 255, 0.1); --select: rgba(255, 255, 255, 0.08); --ok: #30d158; --heal: #5ac8fa; --prov: #ffcc00; --bad: #ff6961; --bad-bg: #3a1a1a; --workflow-zebra: #232325; }
    #app[data-workflows-list="true"] { grid-template-columns: 212px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
    #app[data-workflows-list="true"] :is(#screen-list, #detail-bar) { display: none; }
    #app[data-workflows-list="true"] #main { padding: 0 28px 36px; }
    .library-heading { display: flex; align-items: center; gap: 6px; min-height: 52px; margin-inline: -12px -18px; margin-block-end: 10px; }
    .library-heading h2 { font-size: var(--text-lg); font-weight: 700; letter-spacing: 0; }
    .library-heading .lede { margin: 0; font-size: var(--text-sm); line-height: 1.25; font-variant-numeric: tabular-nums; }
    .library-heading button { height: 28px; min-width: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--quiet); padding: 0 8px; align-items: center; justify-content: center; }
    .library-heading .ico { width: 16px; height: 16px; }
    .library-heading .library-record { display: inline-flex; gap: 6px; margin-inline-start: auto; padding-inline: 10px 12px; color: var(--ink); background: var(--select); font-weight: 500; }
    .record-icon { color: var(--accent); width: 16px; height: 16px; }
    #library :is(button, input) { border-color: var(--quiet); }
    #library-search { font-size: 1rem; }
    #library summary { cursor: pointer; padding-block: var(--space-2); }
    #library summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #library-damaged { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 4px 8px; background: var(--bad-bg); border: 1px solid color-mix(in oklab, var(--bad) 22%, transparent); border-radius: 8px; padding: 10px 12px; margin-block: 4px 12px; overflow-wrap: anywhere; }
    #library-damaged h3 { grid-column: 1 / -1; display: flex; align-items: start; gap: var(--space-2); font-size: var(--text-md); font-weight: 600; letter-spacing: 0; line-height: 1.4; }
    #library-damaged h3 .ico { color: var(--bad); flex: none; width: 16px; height: 16px; margin-block-start: 2px; }
    #library-damaged > p { grid-column: 2; margin: 0; }
    .library-damaged-actions { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-block-start: 6px; align-items: start; }
    #library-damaged > details { grid-column: 2; min-width: 0; max-width: 100%; margin: 0; }
    #library-reveal-status:empty { position: absolute; margin: 0; }
    #library-damaged summary { border: 1px solid var(--quiet); border-radius: 7px; padding: 2px 9px; font-size: var(--text-sm); font-weight: 500; background: var(--bg); }
    #library-damaged details[open] p { max-width: 72ch; }
    #library-damaged ul { margin-block: var(--space-3); padding-inline-start: var(--space-4); }
    #library-damaged li + li { margin-block-start: var(--space-3); }
    #library-damaged li p { margin-block: var(--space-1); }
    #library-damaged .damaged-path { font-family: var(--mono); }
    #library-damaged button { height: auto; min-height: 24px; padding: 2px 9px; border-radius: 7px; font-size: var(--text-sm); }
    .workflow-warning { --bad: #d70015; color: var(--bad); margin-inline-start: auto; display: inline-flex; }
    [data-theme="dark"] .workflow-warning { --bad: #ff6961; }
    #rail nav button .workflow-warning .ico, #rail nav button.on .workflow-warning .ico { color: var(--bad); }
    #workflow-list { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
    #workflow-list :is(th, td) { text-align: start; padding: 4px 8px; vertical-align: middle; overflow-wrap: anywhere; }
    #workflow-list th { height: 26px; color: var(--quiet); font-size: var(--text-sm); font-weight: 600; border-block-end: 1px solid var(--line); }
    #workflow-list th:nth-child(2), #workflow-list th:nth-child(3) { width: 150px; }
    #workflow-list td { height: 30px; }
    #workflow-list td:first-child { border-start-start-radius: 6px; border-end-start-radius: 6px; }
    #workflow-list td:last-child { border-start-end-radius: 6px; border-end-end-radius: 6px; }
    #workflow-list .workflow-row:nth-child(even) td { background: var(--workflow-zebra); }
    #workflow-list .workflow-name { display: block; min-height: 0; width: 100%; color: var(--ink); text-align: start; white-space: normal; line-height: 1.4; font-weight: 500; }
    @media (hover: hover) { #workflow-list .workflow-row:hover td { background: var(--select); } }
    .workflow-note { color: var(--quiet); margin-block: var(--space-1) 0; font-size: var(--text-sm); }
    #workflow-list .status { --workflow-status: var(--quiet); color: var(--workflow-status); display: inline-flex; align-items: center; gap: 5px; padding: 0; background: none; font-weight: 500; font-size: inherit; line-height: 1.4; white-space: normal; }
    #workflow-list .status.passed { --workflow-status: var(--ok); }
    #workflow-list .status.failed, #workflow-list .status.timed-out { --workflow-status: var(--bad); }
    #workflow-list .status.healed { --workflow-status: var(--heal); }
    #workflow-list .status.paused { --workflow-status: var(--need); }
    #workflow-list .status.provisional { --workflow-status: var(--prov); }
    .workflow-status-icon { width: 14px; height: 14px; flex: none; }
    #workflow-list .status .ico { width: 14px; height: 14px; flex: none; }
    .workflow-when { color: var(--quiet); font-variant-numeric: tabular-nums; }
    .workflow-row[hidden] { display: none; }
    #library-search-status { color: var(--quiet); font-size: var(--text-sm); }
    #library-search-status:empty { margin: 0; }
    @container detail (max-width: 480px) {
      #workflow-list thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      #workflow-list tbody { display: block; }
      #workflow-list .workflow-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 8px; border-block-end: 1px solid var(--line); }
      #workflow-list td { padding: 4px 8px; height: auto; }
      #workflow-list .workflow-row td { background: none; }
      #workflow-list .workflow-row:nth-child(even) { background: var(--workflow-zebra); }
      #workflow-list td:first-child { grid-column: 1 / -1; }
    }
    .crumb { margin: 0 0 0.7rem; color: var(--quiet); font-size: var(--text-sm); display: flex; gap: 0.35rem; align-items: center; }
    .wf-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.4rem; }
    .wf-head > div { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .wf-head > button { flex: none; white-space: nowrap; }
    .wf-head .chips { margin-top: 0.45rem; }
    #app { display: grid; grid-template-columns: 212px 340px minmax(0, 1fr); height: 100dvh; min-height: 0; background: Canvas; }
    #rail {
      background: var(--side);
      -webkit-backdrop-filter: blur(40px) saturate(1.8);
      backdrop-filter: blur(40px) saturate(1.8);
      padding: 52px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-inline-end: 1px solid var(--line);
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
    }
    [data-bao-native] #rail { padding-block-start: 52px; }
    [data-bao-native] .skip-link:focus { inset-block-start: 52px; }
    [data-bao-native] #sidebar-dialog #rail { padding-block-start: 94px; }
    [data-bao-native] #sidebar-dialog #sidebar-close { inset-block-start: 52px; }
    #rail nav { display: flex; flex-direction: column; gap: 2px; }
    #rail nav button {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 6px;
      min-height: 28px;
      height: auto;
      padding: 4px 8px;
    }
    #rail nav button.on { background: var(--side-select); font-weight: 500; }
    .place-count, .place-warning { margin-inline-start: auto; color: var(--side-quiet); font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
    #rail nav button.on .place-count { color: var(--ink); }
    .place-warning { color: #d70015; display: inline-flex; }
    [data-theme="dark"] .place-warning { color: #ff6961; }
    .place-warning svg { width: 14px; height: 14px; }
    #rail nav button.on .ico { color: var(--accent); }
    #rail nav button .ico { color: var(--side-quiet); }
    #sidebar-close, #sidebar-toggle { display: none; }
    #sidebar-dialog { padding: 0; margin: 0; width: 212px; max-width: 100%; height: 100dvh; max-height: 100dvh; background: var(--side); color: var(--ink); border: 0; }
    #sidebar-dialog::backdrop { background: rgba(0, 0, 0, 0.28); }
    #sidebar-dialog #rail { height: 100%; padding-block-start: 52px; }
    #sidebar-dialog #sidebar-close { display: block; position: absolute; inset-block-start: 10px; inset-inline-end: 10px; }
    #screen-list { min-width: 0; min-height: 0; border-inline-end: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; }
    .pane-bar { min-height: 52px; flex: none; padding: 10px 16px; display: flex; align-items: center; gap: 8px; background: var(--bg); }
    .pane-bar h1 { margin: 0; font-size: var(--text-lg); line-height: 1.2; }
    #screen-list > .pane-bar { height: 52px; padding: 0 10px 0 16px; }
    .pane-title { min-width: 0; }
    .pane-title p { margin: 0; color: var(--quiet); font-size: var(--text-sm); line-height: 1.25; }
    .pane-bar button { min-height: 28px; height: auto; border: 0; background: transparent; padding: 4px 6px; }
    .pane-bar .runs-record { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 10px; background: rgba(0, 0, 0, .055); border-radius: 7px; font-weight: 500; }
    .runs-record .ico { color: var(--accent); }
    [data-theme="dark"] .pane-bar .runs-record { background: rgba(255, 255, 255, .08); }
    #detail-bar { position: sticky; inset-block-start: 0; z-index: 5; justify-content: space-between; border-block-end: 1px solid var(--line); }
    #screen-title { font-weight: 600; }
    .screen-list { padding: 2px 10px 24px; overflow: auto; overscroll-behavior: contain; }
    .screen-list button { width: 100%; height: auto; display: flex; flex-direction: column; align-items: start; gap: 2px; text-align: start; background: transparent; border: 0; border-radius: 8px; padding: 10px; margin-block-end: 2px; }
    .screen-name { font-weight: 600; }
    .screen-description { color: var(--quiet); font-size: var(--text-sm); }
    .screen-list button.on { background: var(--accent-fill); color: var(--on-accent); }
    .screen-list button.on .screen-description { color: inherit; }
    .screen-list button:focus-visible { outline-offset: -2px; }
    .screen-list button.on:focus-visible { outline-color: var(--on-accent); }
    @media (hover: hover) {
      #rail nav button:not(.on):hover { background: var(--side-select); }
      .screen-list button:not(.on):hover { background: var(--select); }
    }
    .runs-screens { display: flex; flex: none; gap: 4px; padding: 0 10px 8px; border-block-end: 1px solid var(--line); }
    .runs-screens button { width: auto; flex: 1; padding: 6px 8px; align-items: center; }
    .runs-screens .screen-description { display: none; }
    .runs-list { padding: 2px 10px 24px; overflow: auto; min-height: 0; overscroll-behavior: contain; scroll-padding-block: 8px; }
