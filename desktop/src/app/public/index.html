<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Bao</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --side: #ececef;
      --card: #ffffff;
      --ink: #1d1d1f;
      --quiet: #6e6e73;
      --line: #d2d2d7;
      --accent: #0071e3;
      --select: #e8e8ed;
      --ok: #248a3d;
      --ok-bg: #e7f6ec;
      --heal: #0a7ea4;
      --heal-bg: #e5f4f8;
      --prov: #8a5a00;
      --prov-bg: #fff4d6;
      --need: #c93400;
      --need-bg: #fff1e8;
      --bad: #d70015;
      --bad-bg: #fdecea;
      --warn-bg: #fff6e0;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      --radius: 12px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --text-xs: 11px;
      --text-sm: 12px;
      --text-md: 13px;
      --text-lg: 15px;
      --text-xl: 22px;
      --text-2xl: 28px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1c1e;
      --side: #2c2c2e;
      --card: #2c2c2e;
      --ink: #f5f5f7;
      --quiet: #98989d;
      --line: #3a3a3c;
      --accent: #0a84ff;
      --select: #3a3a3c;
      --ok: #30d158;
      --ok-bg: #16301f;
      --heal: #64d2ff;
      --heal-bg: #0e2a33;
      --prov: #ffd60a;
      --prov-bg: #332b0d;
      --need: #ff9f0a;
      --need-bg: #33240d;
      --bad: #ff453a;
      --bad-bg: #3a1614;
      --warn-bg: #33280f;
      --shadow: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font: var(--text-md)/1.45 var(--font);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      height: 32px;
      padding: 0 12px;
      cursor: pointer;
      font-size: var(--text-md);
    }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button.link { border: 0; background: transparent; padding: 0; height: auto; color: var(--accent); font-weight: 600; }
    button.toggle.on { background: var(--select); border-color: var(--accent); }
    button:disabled { opacity: 0.45; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    h2, h3, h4 { font-weight: 650; letter-spacing: -0.02em; }
    h2 { font-size: var(--text-xl); line-height: 1.2; margin: 0; }
    h3 { font-size: var(--text-lg); margin: 0; }
    h3.section { font-size: var(--text-md); margin: 1.1rem 0 0.45rem; }
    .lede, .meta, .quiet { color: var(--quiet); font-size: var(--text-sm); }
    .device { display: flex; justify-content: space-between; gap: 1rem; padding: 0.35rem 0; border-top: 1px solid var(--line); }
    .backup-row { display: flex; justify-content: space-between; gap: 1rem; align-items: end; }
    .backup-row label { min-width: 12rem; margin: 0; }
    .backup-copy { display: flex; flex-wrap: wrap; gap: 0.35rem 0.75rem; align-items: baseline; min-width: 0; }
    .backup-copy p { margin: 0; }
    .sync-cats { list-style: none; padding: 0; margin: 0.2rem 0 0.8rem; }
    .sync-cats li { padding: 0.45rem 0; border-top: 1px solid var(--line); }
    .sync-cats label { display: flex; align-items: center; gap: 0.5rem; margin: 0; font-weight: 600; }
    .sync-cats input { width: auto; }
    .sync-cats p { margin: 0.2rem 0 0; color: var(--quiet); font-size: var(--text-sm); }
    .versions { list-style: none; padding: 0; margin: 0.4rem 0 0; display: grid; gap: 0.7rem; }
    .versions li { padding-top: 0.55rem; border-top: 1px solid var(--line); }
    #versions time { color: var(--quiet); font-size: var(--text-sm); }
    .locator-history { width: 100%; border-collapse: collapse; margin: 0.35rem 0 0; font-size: var(--text-sm); }
    .locator-history th, .locator-history td { text-align: left; font-weight: 500; padding: 0.2rem 0.55rem 0.2rem 0; color: var(--quiet); }
    .locator-history th { font-size: var(--text-xs); }
    .version-diff { margin: 0.35rem 0 0; }
    .conflict-banner { margin: 0.45rem 0 0; font-weight: 650; }
    .conflict-diff { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 0.45rem 0; }
    .conflict-diff h4 { margin: 0 0 0.35rem; font-size: var(--text-md); }
    .conflict-diff ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.35rem; }
    .conflict-diff li { display: grid; gap: 0.1rem; padding: 0.4rem 0.5rem; border-radius: 8px; background: transparent; border-top: 0; }
    .conflict-diff li span { color: var(--quiet); font-size: var(--text-sm); }
    .conflict-diff li[data-changed="true"] { outline: 1px solid var(--accent); background: var(--select); }
    .version-steps { margin: 0.35rem 0 0; }
    .version-steps summary { cursor: pointer; color: var(--quiet); }
    .version-steps ol { list-style: none; padding: 0; margin: 0.35rem 0 0; display: grid; gap: 0.35rem; }
    .version-steps li { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; padding-top: 0; border-top: 0; color: var(--quiet); font-size: var(--text-sm); }
    .version-steps li[data-changed="true"] { color: var(--ink); }
    .lede { font-size: var(--text-md); margin: 0.35rem 0 var(--space-4); }
    .crumb { margin: 0 0 0.7rem; color: var(--quiet); font-size: var(--text-sm); display: flex; gap: 0.35rem; align-items: center; }
    .wf-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.4rem; }
    .wf-head .chips { margin-top: 0.45rem; }
    #app { display: grid; grid-template-columns: 216px 1fr; min-height: 100vh; }
    #rail {
      background: var(--side);
      padding: var(--space-4) var(--space-3);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      border-right: 1px solid var(--line);
    }
    #rail .brand { display: flex; align-items: center; justify-content: space-between; padding: 0.2rem 0.45rem 0.7rem; font-size: var(--text-lg); }
    #rail nav { display: flex; flex-direction: column; gap: 2px; }
    #rail nav button {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      text-align: left;
      background: transparent;
      border-color: transparent;
      border-radius: 8px;
      height: auto;
      padding: 0.4rem 0.5rem;
    }
    #rail nav button.on { background: var(--card); box-shadow: var(--shadow); }
    .ico { width: 16px; height: 16px; flex: none; }
    .rail-foot { margin-top: auto; padding: 0.7rem 0.45rem 0.2rem; color: var(--quiet); display: grid; gap: 0.3rem; font-size: var(--text-sm); }
    .channel { display: flex; align-items: center; gap: 0.4rem; }
    .count {
      min-width: 1.15rem;
      text-align: center;
      background: var(--need);
      color: white;
      border-radius: 999px;
      font-size: var(--text-xs);
      padding: 0 0.35rem;
    }
    .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #c7c7cc; display: inline-block; }
    .dot.on { background: #ff3b30; }
    .dot.need { background: var(--need); }
    #helper-status { position: relative; display: flex; align-items: center; gap: 0.35rem; }
    #perm-dot summary { cursor: pointer; list-style: none; display: flex; }
    #perm-dot summary::-webkit-details-marker { display: none; }
    #perm-dot .perms {
      position: absolute; left: 0; bottom: 1.4rem; z-index: 6; min-width: 14rem;
      background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0.45rem 0.6rem;
    }
    #onboarding summary { cursor: pointer; font-weight: 650; }
    #content { min-width: 0; }
    #act { padding: var(--space-4) var(--space-5) 0; }
    #onboard { padding: 0 var(--space-5); }
    #main { padding: var(--space-3) var(--space-5) 4rem; }
    .card, .why, #heal-detail, #run-viewer, #run-envelope, .wf-card, .step-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      margin: 0.55rem 0;
      box-shadow: var(--shadow);
    }
    #act-bar {
      background: var(--need-bg);
      border: 1px solid var(--need);
      border-left: 4px solid var(--need);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      margin-bottom: 0.35rem;
    }
    #act-bar .kicker { margin: 0; font-weight: 700; color: var(--need); font-size: var(--text-sm); letter-spacing: 0.01em; }
    #act-bar .instruction { margin: 0.3rem 0; font-size: 17px; font-weight: 650; letter-spacing: -0.02em; }
    #act-bar .timeout { margin: 0.1rem 0 0.5rem; color: var(--quiet); }
    label { display: grid; gap: 0.25rem; margin: 0.5rem 0; }
    input, select, textarea {
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      width: 100%;
    }
    .row { display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap; }
    .tools { display: flex; gap: var(--space-2); align-items: center; margin: 0 0 var(--space-4); }
    .tools input { max-width: 420px; }
    .kbd {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--quiet);
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      font-size: var(--text-sm);
    }
    .drop { outline: 1px dashed var(--line); border-radius: 10px; padding: 0.7rem; background: var(--bg); }
    .drop.over { outline-color: var(--accent); }
    .pass, .passed { color: var(--ok); }
    .fail, .failed { color: var(--bad); }
    .paused { color: var(--need); }
    .healed { color: var(--heal); }
    .provisional { color: var(--prov); }
    .badge, .status {
      display: inline-block;
      border-radius: 999px;
      padding: 0.05rem 0.5rem;
      font-size: var(--text-xs);
      font-weight: 650;
    }
    .badge { background: var(--ink); color: var(--bg); }
    .quiet-badge { background: var(--select); color: var(--ink); }
    .status.passed { background: var(--ok-bg); color: var(--ok); }
    .status.failed { background: var(--bad-bg); color: var(--bad); }
    .status.timed-out { background: var(--bad-bg); color: var(--bad); }
    .status.paused { background: var(--need-bg); color: var(--need); }
    .status.unchecked { background: var(--select); color: var(--quiet); }
    details { margin: 0.7rem 0 0.2rem; }
    details summary { cursor: pointer; font-weight: 650; }
    .hint { color: var(--quiet); font-size: var(--text-sm); margin: 0.35rem 0 0.2rem; }
    .profiles { display: grid; gap: 0.6rem; }
    button.profile {
      display: grid;
      grid-template-columns: 48px 1fr;
      column-gap: 0.75rem;
      align-items: center;
      text-align: left;
      width: 100%;
      height: auto;
      padding: 0.75rem 0.9rem;
      border-radius: var(--radius);
      background: var(--card);
    }
    button.profile.on { background: var(--select); border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .profile img, .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--select);
      object-fit: cover;
      display: grid;
      place-items: center;
      font-weight: 650;
    }
    .profile .email, .profile .meta { color: var(--quiet); font-size: var(--text-sm); }
    .saved-row { padding: 0.45rem 0; border-top: 1px solid var(--line); }
    .saved-row strong { min-width: 12rem; }
    .saved-row .quiet { margin-right: auto; }
    .result h3 { margin: 0 0 0.4rem; }
    .result h3.pass { color: var(--ok); }
    .result h3.fail { color: var(--need); }
    .status.healed { background: var(--heal-bg); color: var(--heal); }
    .status.provisional { background: var(--prov-bg); color: var(--prov); }
    .badge.expect { background: var(--heal-bg); color: var(--heal); }
    .badge.need { background: var(--need-bg); color: var(--need); }
    .badge.you { background: #eef2f8; color: #33415c; }
    [data-theme="dark"] .badge.you { background: #2a3142; color: #d5dbee; }
    #toasts { position: fixed; top: 16px; right: 16px; z-index: 45; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); }
    .toast { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0.7rem 0.75rem; box-shadow: var(--shadow); }
    .toast strong { display: block; font-size: var(--text-sm); }
    .toast button { height: 28px; padding: 0 10px; }
    pre { white-space: pre-wrap; font: var(--text-sm)/1.45 var(--mono); }
    table.grid, table.identity, #pass-grid { width: 100%; border-collapse: collapse; }
    table.grid th, table.grid td, table.identity th, table.identity td, #pass-grid th, #pass-grid td {
      text-align: left;
      padding: 0.4rem 0.45rem;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    .wf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: var(--space-3); align-items: stretch; }
    .wf-card {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-areas: "title" "thumb" "mid" "foot";
      grid-template-rows: 28px 148px minmax(28px, 1fr) 32px;
      gap: 8px;
      margin: 0;
      align-items: stretch;
      height: 276px;
      padding: 12px;
    }
    .wf-title { grid-area: title; margin: 0; text-align: left; align-self: center; }
    .wf-title button.link { color: var(--ink); font-size: var(--text-lg); font-weight: 650; letter-spacing: -0.02em; }
    .wf-mid { grid-area: mid; min-width: 0; align-self: center; }
    .wf-foot { grid-area: foot; display: flex; align-items: center; gap: 10px; min-width: 0; height: 32px; }
    .wf-foot .spark { flex: 1; }
    .wf-foot button { margin-left: auto; }
    .thumb {
      grid-area: thumb;
      height: 112px;
      border-radius: 10px;
      background: var(--select);
      overflow: hidden;
      position: relative;
    }
    .wf-card .thumb { height: 148px; }
    .thumb.mini { width: 96px; height: 64px; flex: none; }
    .thumb img, .frame img, .shot-stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; border: 0; }
    .ph { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 4px; padding: 6px; color: var(--quiet); text-align: center; }
    .ph-ico svg { width: 18px; height: 18px; }
    .ph-label { font-size: 11px; line-height: 1.2; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .has-shot .ph { display: none; }
    .share { position: relative; display: inline-block; margin-top: 8px; }
    .share-panel {
      position: absolute;
      z-index: 6;
      top: calc(100% + 6px);
      left: 0;
      min-width: 16rem;
      display: grid;
      gap: 6px;
      padding: 10px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }
    .share-panel[hidden] { display: none; }
    .share-panel button { text-align: left; }
    .share-why { margin: 0; color: var(--quiet); font-size: var(--text-sm); }
    .legend { display: flex; flex-wrap: wrap; gap: 10px 14px; color: var(--quiet); font-size: var(--text-xs); margin: 0 0 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; background: var(--line); }
    .swatch.passed { background: var(--ok); }
    .swatch.healed { background: var(--heal); }
    .swatch.provisional { background: var(--prov); }
    .swatch.paused { background: var(--need); }
    .swatch.failed, .swatch.timed-out { background: var(--bad); }
    .spark { display: flex; gap: 4px; align-items: center; min-height: 10px; }
    .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 0.35rem; }
    .chip { background: var(--select); border-radius: 999px; padding: 0.05rem 0.45rem; font-size: var(--text-xs); }
    .chip.secret { background: var(--prov-bg); color: var(--prov); }
    .chip.id-chip { font-family: var(--mono); }
    button.token {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      height: auto;
      margin: 0 0.15rem;
      padding: 0.08rem 0.45rem;
      border-radius: 999px;
      background: #e7f0ff;
      border-color: #8eb4f0;
      color: #12315c;
      font-size: var(--text-xs);
      line-height: 1.3;
      vertical-align: baseline;
    }
    [data-theme="dark"] button.token { background: #1c3358; border-color: #3d6cb5; color: #d6e6ff; }
    button.token.secret { background: var(--prov-bg); color: var(--prov); border-color: transparent; }
    .token-meta { opacity: 0.8; }
    .token-editor { display: grid; gap: 0.35rem; margin-top: 0.35rem; padding: 0.55rem; background: var(--select); border-radius: 8px; }
    .token-editor label { margin: 0; }
    .try-slot { min-width: 0; }
    #try-result { margin-top: 0.35rem; display: grid; gap: 0.35rem; }
    #try-result img, img.try-outline { position: static; width: auto; max-width: 420px; height: auto; border-radius: 8px; border: 1px solid var(--line); }
    #try-lead { margin: 0; font-variant-numeric: tabular-nums; }
    #site-trust label { display: flex; justify-content: space-between; gap: 1rem; align-items: center; margin-top: 0.45rem; }
    #site-trust select { width: auto; min-width: 9rem; }
    #workflow-steps { display: flex; flex-direction: column; gap: 8px; }
    .step-card { display: flex; align-items: flex-start; gap: 10px; margin: 0; padding: 6px 12px; }
    .step-card .thumb { width: 240px; height: 88px; flex: none; grid-area: auto; border-radius: 8px; }
    .step-card .thumb img { object-fit: contain; object-position: center; }
    .step-copy { display: grid; gap: 2px; min-width: 0; }
    .step-copy p { margin: 0; }
    .step-copy .chips { margin-top: 0; }
    .step-card.human { background: var(--card); border-color: var(--line); box-shadow: inset 3px 0 0 #8d6a3a; }
    .split { display: grid; grid-template-columns: 240px 1fr; gap: 0.9rem; }
    .split.with-failure { grid-template-columns: 220px minmax(0, 1fr) 260px; }
    #failure-panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.75rem 0.85rem; }
    #failure-panel h3, #failure-panel h4 { margin: 0 0 0.35rem; }
    #failure-panel h4 { margin-top: 0.7rem; font-size: var(--text-sm); color: var(--quiet); }
    #failure-phase { margin: 0; }
    #locator-tries { list-style: none; margin: 0; padding: 0; }
    #locator-tries li { display: flex; justify-content: space-between; gap: 8px; padding: 0.28rem 0; border-top: 1px solid var(--line); }
    #locator-tries em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--quiet); }
    #recovered-row { margin: 0.35rem 0 0.6rem; padding: 0.4rem 0.65rem; background: var(--ok-bg); color: var(--ok); border-radius: 8px; font-weight: 650; }
    .step em.recovered { color: var(--ok); font-style: normal; }
    .step em.ask { color: var(--need); font-style: normal; margin-left: 0.3rem; }
    .step-list { display: flex; flex-direction: column; gap: 0.25rem; }
    .step { text-align: left; background: transparent; width: 100%; }
    .step.on { background: var(--select); }
    .step em { color: var(--quiet); font-style: normal; margin-left: 0.3rem; }
    .bar { display: flex; gap: 3px; align-items: center; margin: 0.7rem 0; }
    .seg { height: 8px; flex: 1; border-radius: 99px; background: var(--select); }
    .seg.passed { background: var(--ok); }
    .seg.failed { background: var(--bad); }
    .seg.paused { background: var(--need); }
    .bar-count { color: var(--quiet); margin-left: 0.4rem; }
    .shot-stage, .compare { position: relative; height: 220px; border-radius: 10px; overflow: hidden; background: var(--select); border: 1px solid var(--line); }
    .compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; border: 0; }
    #shot-slider { position: absolute; left: 12px; right: 12px; bottom: 10px; width: auto; }
    .filmstrip { display: flex; gap: 8px; overflow: auto; padding: 4px 0 10px; align-items: center; }
    .skip-marker {
      flex: none;
      align-self: center;
      font-size: var(--text-xs);
      font-weight: 650;
      color: var(--ink);
      background: var(--warn-bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.15rem 0.5rem;
      white-space: nowrap;
    }
    .timeline .skip-marker { position: absolute; top: 2px; transform: translateX(-50%); z-index: 1; }
    .review { color: var(--need); font-style: normal; margin-left: 0.35rem; }
    .frame { width: auto; min-width: 72px; height: 140px; flex: 1 1 72px; padding: 0; position: relative; overflow: hidden; background: var(--select); border-radius: 8px; }
    #snapshot-inspector { margin-top: 0.8rem; }
    #snapshot-inspector h4 { margin: 0.6rem 0 0.2rem; font-size: var(--text-sm); color: var(--quiet); }
    #dom-snapshot, #console-log, #network-log { margin: 0.2rem 0 0.6rem; padding-left: 1.2rem; max-height: 240px; overflow: auto; }
    #ax-snapshot { max-height: 240px; overflow: auto; background: var(--bg); border-radius: 8px; padding: 0.5rem 0.6rem; }
    .frame.on { outline: 2px solid var(--accent); outline-offset: 1px; }
    #scrubber { width: 100%; accent-color: var(--accent); }
    .timeline { position: relative; height: 28px; margin: 0.4rem 0; background: var(--select); border-radius: 6px; overflow: hidden; }
    .idle-shade {
      position: absolute;
      top: 0;
      bottom: 0;
      background: repeating-linear-gradient(-45deg, var(--warn-bg), var(--warn-bg) 4px, transparent 4px, transparent 8px);
      pointer-events: none;
    }
    .marker { position: absolute; top: 2px; transform: translateX(-50%); min-width: 1.3rem; padding: 0.1rem 0.25rem; z-index: 1; height: auto; }
    button.status { height: auto; }
    button.swatch { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 3px; }
    button.cell { width: 16px; height: 16px; padding: 0; border: 0; }
    .marker.failed { color: var(--bad); }
    .heal-row { display: block; width: 100%; text-align: left; margin: 0.3rem 0; }
    .cell { width: 16px; height: 16px; border-radius: 4px; display: inline-block; background: var(--select); }
    #pass-grid th { font-size: var(--text-sm); font-weight: 600; color: var(--quiet); white-space: nowrap; }
    #pass-grid th time { font-variant-numeric: tabular-nums; }
    #pass-grid td { text-align: center; }
    table.identity { font-size: var(--text-sm); }
    table.identity th { color: var(--quiet); font-weight: 600; white-space: nowrap; }
    .grid-wrap { margin-top: 0.6rem; }
    #live-step-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .live-step { display: flex; gap: 10px; align-items: center; }
    details#trajectory { margin-top: 0.8rem; }
    details#trajectory summary { cursor: pointer; font-weight: 600; }
    .cell.passed { background: var(--ok); }
    .cell.failed { background: var(--bad); }
    .cell.paused { background: var(--need); }
    .cell.healed { background: var(--heal); }
    .cell.empty { background: transparent; border: 1px solid var(--line); }
    details { margin: 0.45rem 0; }
    .empty { padding: 1.6rem 0.2rem; color: var(--quiet); }
    .empty strong { display: block; color: var(--ink); font-size: var(--text-lg); margin-bottom: 0.25rem; }
    #teach-panel {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: 360px;
      max-width: calc(100vw - 24px);
      max-height: min(72vh, 680px);
      display: flex;
      flex-direction: column;
      z-index: 32;
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }
    #teach-bar {
      display: flex;
      gap: 0.3rem;
      align-items: center;
      background: var(--ink);
      color: var(--bg);
      padding: 0.4rem 0.45rem 0.4rem 0.7rem;
      flex-wrap: wrap;
    }
    #teach-bar button, #record-bar button { background: transparent; color: inherit; border-color: transparent; height: 26px; padding: 0 8px; }
    #teach-bar input.note-field, #record-bar input.note-field {
      height: 26px; width: 8.5rem; background: var(--bg); color: var(--ink);
      border: 0; border-radius: 8px; padding: 0 8px;
    }
    .badge.flag { background: var(--select); color: var(--ink); }
    .badge.note { background: #f3e2d4; color: #6b3a1f; }

    #guide-panel {
      position: fixed; top: 16px; right: 16px; z-index: 33; width: 280px;
      background: var(--card); color: var(--ink); border: 1px solid var(--line);
      border-radius: 16px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22); padding: 0.9rem 1rem;
    }
    #guide-panel h2 { margin: 0; font-size: var(--text-lg); }

    #guide-actions { margin: 0; font-variant-numeric: tabular-nums; font-weight: 650; }
    #guide-step { font-weight: 650; margin: 0.6rem 0 0.2rem; }
    #teach-bar button:hover { background: rgba(255, 255, 255, 0.12); }
    #teach-bar .quiet, #teach-blur { color: inherit; opacity: 0.8; font-size: var(--text-xs); }
    #teach-cards { overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .teach-card { align-items: stretch; flex-wrap: wrap; padding: 4px 8px; }
    .teach-card.on { background: var(--select); }
    button.teach-row, .teach-row {
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 2px 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      color: inherit;
      text-align: left;
      min-height: 44px;
      box-shadow: none;
      font-size: inherit;
    }
    .teach-card .thumb.mini { width: 72px; height: 44px; grid-area: auto; border-radius: 6px; flex: none; }
    .teach-card .intent-read {
      flex: 1 1 10rem;
      min-width: 8rem;
      margin: 0;
      font-weight: 650;
      white-space: normal;
      overflow: visible;
      overflow-wrap: anywhere;
    }
    .teach-card .note-read {
      flex: 1 1 100%;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .teach-card .note-as-intent {
      flex: 1 1 100%;
      color: var(--quiet);
      font-size: var(--text-xs);
      font-weight: 650;
    }
    .teach-edit { display: none; width: 100%; }
    .teach-card.open .teach-edit { display: grid; gap: 6px; padding: 4px 0 8px; }
    .teach-card label { margin: 0; }
    .teach-value input { width: 7.5rem; }
    .teach-actions button, .teach-value button { height: 26px; padding: 0 8px; font-size: var(--text-xs); }
    .badge.edited { flex: none; }
    .teach-dropped summary { cursor: pointer; font-weight: 650; color: var(--quiet); }
    .teach-dropped p { margin: 0.2rem 0; }
    .teach-review-body { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 16px; align-items: start; }
    #teach-trail { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.65rem 0.8rem; }
    #teach-trail summary { cursor: pointer; font-weight: 650; }
    #teach-steps { display: flex; flex-direction: column; gap: 6px; }
    #teach-review .step-card { margin: 0; }
    #teach-summary { font-weight: 650; margin: 0 0 0.4rem; }
    #teach-dropped-reasons { margin: 0 0 1rem; padding-left: 1.2rem; color: var(--quiet); }
    #route-ran { font-weight: 650; margin: 0.2rem 0 0; }
    .badge.route { background: var(--select); color: var(--ink); }
    em.route { color: var(--quiet); font-style: normal; margin-left: 0.35rem; }
    #record-bar {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      display: flex;
      gap: 0.35rem;
      align-items: center;
      background: var(--ink);
      color: var(--bg);
      border-radius: 999px;
      padding: 0.4rem 0.45rem 0.4rem 0.85rem;
      z-index: 30;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
    }
    #record-bar button { background: transparent; color: inherit; border-color: transparent; }
    #record-bar button:hover { background: rgba(255, 255, 255, 0.12); }
    #rec-timer { font-variant-numeric: tabular-nums; min-width: 2.8rem; }
    .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; }
    #record-bar[data-paused="true"] .rec-dot { background: var(--need); }
    #onboarding { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 1rem 1.1rem; margin-top: var(--space-3); }
    .perms { list-style: none; padding: 0; margin: 0.6rem 0; display: grid; gap: 0.35rem; }
    .perm { display: flex; gap: 0.5rem; align-items: center; }
    .perm .mark { width: 1.1rem; text-align: center; }
    .perm[data-ok="true"] .mark::before { content: "✓"; color: var(--ok); font-weight: 700; }
    .perm[data-ok="false"] .mark::before { content: "○"; color: var(--quiet); }
    #palette { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.28); z-index: 40; display: grid; align-items: start; justify-content: center; padding-top: 12vh; }
    #palette[hidden] { display: none; }
    #palette .panel { width: min(520px, 92vw); background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18); }
    #palette input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 0.8rem 0.9rem; }
    #palette button.hit { display: flex; justify-content: space-between; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 0; padding: 0.55rem 0.9rem; }
    #palette button.hit.on { background: var(--select); }
    .status.unchecked { background: var(--select); color: var(--quiet); }
    .profiles { display: grid; gap: 0.6rem; }
    button.profile {
      display: grid; grid-template-columns: 48px 1fr; column-gap: 0.75rem; align-items: center;
      text-align: left; width: 100%; height: auto; padding: 0.75rem 0.9rem; border-radius: var(--radius); background: var(--card);
    }
    button.profile.on { background: var(--select); border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .profile img, .avatar {
      width: 48px; height: 48px; border-radius: 50%; background: var(--select); object-fit: cover;
      display: grid; place-items: center; font-weight: 650;
    }
    .profile .email, .profile .meta { color: var(--quiet); font-size: var(--text-sm); }
    .saved-row { padding: 0.45rem 0; border-top: 1px solid var(--line); }
    .saved-row strong { min-width: 12rem; }
    .saved-row .quiet { margin-right: auto; }
    .result h3.pass { color: var(--ok); }
    .result h3.fail { color: var(--bad); }
    @media (max-width: 800px) {
      #app { grid-template-columns: 1fr; }
      .split, .split.with-failure { grid-template-columns: 1fr; }
      .wf-card { grid-template-columns: 1fr; }
      #main, #act, #onboard { padding-left: var(--space-3); padding-right: var(--space-3); }
    }
  </style>
</head>
<body>
  <div id="toasts"></div>
  <div id="app">
    <aside id="rail"></aside>
    <div id="content">
      <div id="act"></div>
      <div id="onboard"></div>
      <main id="main"></main>
    </div>
  </div>
  <div id="float"></div>
  <div id="palette" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
