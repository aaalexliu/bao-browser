<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Bao</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --side: #ececef;
      --card: #ffffff;
      --ink: #1d1d1f;
      --quiet: #6e6e73;
      --line: #d2d2d7;
      --accent: #0071e3;
      --select: #e8e8ed;
      --ok: #248a3d;
      --ok-bg: #e7f6ec;
      --heal: #0a7ea4;
      --heal-bg: #e5f4f8;
      --need: #c93400;
      --need-bg: #fff1e8;
      --bad: #d70015;
      --bad-bg: #fdecea;
      --warn-bg: #fff6e0;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      --radius: 12px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --text-xs: 11px;
      --text-sm: 12px;
      --text-md: 13px;
      --text-lg: 15px;
      --text-xl: 22px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1c1e;
      --side: #2c2c2e;
      --card: #2c2c2e;
      --ink: #f5f5f7;
      --quiet: #98989d;
      --line: #3a3a3c;
      --accent: #0a84ff;
      --select: #3a3a3c;
      --ok: #30d158;
      --ok-bg: #16301f;
      --heal: #64d2ff;
      --heal-bg: #0e2a33;
      --need: #ff9f0a;
      --need-bg: #33240d;
      --bad: #ff453a;
      --bad-bg: #3a1614;
      --warn-bg: #33280f;
      --shadow: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--bg); font: var(--text-md)/1.45 var(--font); }
    button, input, select, textarea { font: inherit; color: inherit; }
    button {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      height: 32px;
      padding: 0 12px;
      cursor: pointer;
      font-size: var(--text-md);
    }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button:disabled { opacity: 0.45; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    h2, h3 { font-weight: 650; letter-spacing: -0.02em; }
    h2 { font-size: var(--text-xl); line-height: 1.2; margin: 0; }
    h3 { font-size: var(--text-lg); margin: 0 0 0.35rem; }
    .lede, .quiet { color: var(--quiet); }
    .lede { margin: 0.35rem 0 var(--space-4); }
    #app { display: grid; grid-template-columns: 216px 1fr; min-height: 100vh; }
    #rail {
      background: var(--side);
      padding: var(--space-4) var(--space-3);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      border-right: 1px solid var(--line);
    }
    #rail .brand { padding: 0.2rem 0.45rem 0.7rem; font-size: var(--text-lg); }
    #rail nav { display: flex; flex-direction: column; gap: 2px; }
    #rail nav button {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      text-align: left;
      background: transparent;
      border-color: transparent;
      border-radius: 8px;
      height: auto;
      padding: 0.4rem 0.5rem;
    }
    #rail nav button.on { background: var(--card); box-shadow: var(--shadow); }
    .ico { width: 16px; height: 16px; flex: none; }
    .rail-foot { margin-top: auto; padding: 0.7rem 0.45rem 0.2rem; display: grid; gap: 0.45rem; }
    .channel { display: flex; align-items: center; gap: 0.4rem; color: var(--quiet); font-size: var(--text-sm); }
    .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #c7c7cc; display: inline-block; }
    .dot.on { background: #ff3b30; }
    #content { min-width: 0; }
    #act { padding: var(--space-4) var(--space-5) 0; }
    #act:empty { display: none; }
    #main { padding: var(--space-3) var(--space-5) 4rem; max-width: 52rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      margin: 0.55rem 0;
      box-shadow: var(--shadow);
    }
    #act-bar {
      background: var(--need-bg);
      border: 1px solid var(--need);
      border-left: 4px solid var(--need);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      margin-bottom: 0.35rem;
    }
    #act-bar .kicker { margin: 0; font-weight: 700; color: var(--need); font-size: var(--text-sm); }
    #act-bar .instruction { margin: 0.3rem 0 0.55rem; font-size: 17px; font-weight: 650; letter-spacing: -0.02em; }
    label { display: grid; gap: 0.25rem; margin: 0.5rem 0; }
    input, select, textarea {
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      width: 100%;
    }
    .row { display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap; }
    .drop { outline: 1px dashed var(--line); border-radius: 10px; padding: 0.7rem; }
    .drop.over { outline-color: var(--accent); }
    .pass, .passed { color: var(--ok); }
    .fail, .failed, .paused { color: var(--bad); }
    .badge, .status {
      display: inline-block;
      border-radius: 999px;
      padding: 0.05rem 0.5rem;
      font-size: var(--text-xs);
      font-weight: 650;
    }
    .badge { background: var(--ink); color: var(--bg); }
    .status.passed { background: var(--ok-bg); color: var(--ok); }
    .status.paused, .status.failed { background: var(--need-bg); color: var(--need); }
    .status.unchecked { background: var(--select); color: var(--quiet); }
    .notice { background: var(--warn-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.7rem 0.8rem; margin: 0.45rem 0; }
    pre { white-space: pre-wrap; font: var(--text-sm)/1.45 var(--mono); }
    details { margin: 0.7rem 0 0.2rem; }
    details summary { cursor: pointer; font-weight: 650; }
    .hint { color: var(--quiet); font-size: var(--text-sm); margin: 0.35rem 0 0.2rem; }
    .profiles { display: grid; gap: 0.6rem; }
    button.profile {
      display: grid;
      grid-template-columns: 48px 1fr;
      column-gap: 0.75rem;
      align-items: center;
      text-align: left;
      width: 100%;
      height: auto;
      padding: 0.75rem 0.9rem;
      border-radius: var(--radius);
      background: var(--card);
    }
    button.profile.on { background: var(--select); border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .profile img, .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--select);
      object-fit: cover;
      display: grid;
      place-items: center;
      font-weight: 650;
    }
    .profile .email, .profile .meta { color: var(--quiet); font-size: var(--text-sm); }
    .saved-row { padding: 0.45rem 0; border-top: 1px solid var(--line); }
    .saved-row strong { min-width: 12rem; }
    .saved-row .quiet { margin-right: auto; }
    .result h3 { margin: 0 0 0.4rem; }
    @media (max-width: 800px) {
      #app { grid-template-columns: 1fr; }
      #main, #act { padding-left: var(--space-3); padding-right: var(--space-3); }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="rail">
      <div class="brand"><strong>bao</strong></div>
      <nav>
        <button type="button" data-screen="sessions"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.5 4a8.5 8.5 0 11-17 0 8.5 8.5 0 0117 0z"/></svg>Sessions</button>
        <button type="button" data-screen="trail"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 6h16v3H4V6zm0 5h16v3H4v-3zm0 5h10v3H4v-3z"/></svg>Trail</button>
        <button type="button" data-screen="library"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>Library</button>
        <button type="button" data-screen="replay"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 4l2.2 4.6L19 9.2l-3.5 3.4.8 4.9L12 15.8 7.7 17.5l.8-4.9L5 9.2l4.8-.6L12 4z"/></svg>Replay</button>
        <button type="button" data-screen="logins"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12a4 4 0 100-8 4 4 0 000 8zm-7 9a7 7 0 0114 0H5z"/></svg>Logins</button>
        <button type="button" data-screen="settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8.5A3.5 3.5 0 1012 15.5 3.5 3.5 0 0012 8.5zM4 12l2-.6.4-1.6-1.2-1.6 1.8-1.8 1.6 1.2 1.6-.4L11 5h2l.4 2.2 1.6.4 1.6-1.2 1.8 1.8-1.2 1.6.4 1.6 2 .6v2l-2 .6-.4 1.6 1.2 1.6-1.8 1.8-1.6-1.2-1.6.4L13 21h-2l-.4-2.2-1.6-.4-1.6 1.2-1.8-1.8 1.2-1.6-.4-1.6L4 14v-2z"/></svg>Settings</button>
      </nav>
      <div class="rail-foot">
        <div class="channel"><span class="dot" id="dot"></span><span id="rec-label">Idle</span></div>
        <button type="button" id="theme-toggle" aria-pressed="false">Dark</button>
      </div>
    </aside>
    <div id="content">
      <div id="act"></div>
      <main id="main"></main>
    </div>
  </div>
  <script>
    const main = document.getElementById("main");
    const act = document.getElementById("act");
    let state = { recording: false, notices: [], settings: { heal: "auto" }, workflows: [], trails: [], runs: [] };
    let screen = "sessions";
    let login = { site: "", probeUrl: "", selector: "", text: "", origins: "", botCookies: "skip", advancedOpen: false, preview: null, report: null, error: "", selected: "", saved: [] };
    let lastRun = null;
    let lastWf = "";
    let banner = null;

    function applyTheme(theme) {
      const next = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("bao-theme", next); } catch { /* storage can be blocked */ }
      const toggle = document.getElementById("theme-toggle");
      if (toggle) {
        toggle.textContent = next === "dark" ? "Light" : "Dark";
        toggle.setAttribute("aria-pressed", next === "dark" ? "true" : "false");
      }
      const select = document.getElementById("theme");
      if (select) select.value = next;
    }

    try { applyTheme(localStorage.getItem("bao-theme") || "light"); } catch { applyTheme("light"); }

    async function refresh() {
      state = await (await fetch("/api/state")).json();
      if (screen === "logins") await loadSaved();
      render();
    }

    async function loadSaved() {
      const body = await (await fetch("/api/login-sites")).json();
      login.saved = body.sites || [];
    }

    function render() {
      const views = { sessions, trail, library, replay, settings, logins };
      act.innerHTML = screen === "logins" ? loginAct() : "";
      main.innerHTML = notices() + views[screen]();
      paintRail();
      bind();
    }

    function paintRail() {
      document.querySelectorAll("#rail nav button").forEach((btn) => btn.classList.toggle("on", btn.dataset.screen === screen));
      document.getElementById("dot").classList.toggle("on", state.recording);
      document.getElementById("rec-label").textContent = state.recording ? "Recording" : "Idle";
      const toggle = document.getElementById("theme-toggle");
      const dark = document.documentElement.dataset.theme === "dark";
      if (toggle) {
        toggle.textContent = dark ? "Light" : "Dark";
        toggle.setAttribute("aria-pressed", dark ? "true" : "false");
      }
    }

    function sessions() {
      return `<section>
        <h2>Sessions</h2>
        <p class="lede">Nothing is recorded until you start a session. The capture browser uses an app-owned profile, not your daily Chrome. To bring one site's login across, open Logins and click import for that site.</p>
        <div class="card">
          <h3>Browser</h3>
          <label>Start URL <input id="start-url" value="${location.origin}/fixture"></label>
          <div class="row"><button class="primary" id="start" type="button">Start capture</button><button id="stop" type="button">Stop and save</button></div>
        </div>
        <div class="card">
          <h3>Desktop</h3>
          <p>On macOS, start <code>BaoOSHelper.app</code> (bundle <code>dev.bao.oshelper</code>) and grant Accessibility and Screen Recording. On Linux the AT-SPI helper is <code>bao-os-helper</code>. Computer-use clicks land through the proxy or the MCP server, and the trail is the record.</p>
        </div>
        <div class="card">
          <h3>Proxy and MCP</h3>
          <p>The OpenAI and Claude computer-use executors live in the desktop proxy code from the spikes. This server does not mount those HTTP routes. MCP is a stdio process, <code>bao mcp</code>, and it records screenshot, click, type, key, and scroll into the local trail. No call leaves the machine unless you set a model key for healing.</p>
        </div>
      </section>`;
    }

    function trail() {
      const ids = state.trails.map((id) => `<option value="${id}">${id}</option>`).join("");
      return `<section><h2>Audit trail</h2>
        <label>Trail <select id="trail-id">${ids}</select></label>
        <button id="load-trail" type="button">Load</button>
        <pre id="trail-view">Values are masked. File paths are not stored.</pre>
      </section>`;
    }

    function library() {
      const cards = state.workflows.map((wf) => {
        const healed = state.runs.some((run) => run.workflowId === wf.id && run.heals && run.heals.length);
        return `<div class="card"><div class="row"><strong>${esc(wf.name)}</strong> ${healed ? '<span class="badge" data-workflow-heal="' + esc(wf.id) + '">healed</span>' : ""}</div>
          <div class="quiet">${wf.steps} steps</div>
          <div class="row">
            <button type="button" data-open="${wf.id}">Edit</button>
            <button type="button" data-export="${wf.id}">Export</button>
            <button type="button" data-rename="${wf.id}">Rename</button>
            <button type="button" data-delete="${wf.id}">Delete</button>
          </div></div>`;
      }).join("");
      return `<section><h2>Library</h2>${cards || "<p class=\"lede\">No workflows yet.</p>"}
        <div class="card"><h3>Import</h3><textarea id="import-json" rows="4"></textarea><button id="import" type="button">Import JSON</button></div>
        <div id="editor"></div></section>`;
    }

    function replay() {
      const selected = lastWf || (state.workflows[0] && state.workflows[0].id) || "";
      const current = state.workflows.find((wf) => wf.id === selected);
      const mode = (current && current.heal) || "";
      const globalHeal = (state.settings && state.settings.heal) || "auto";
      const options = state.workflows.map((wf) => `<option value="${esc(wf.id)}" ${wf.id === selected ? "selected" : ""}>${esc(wf.name)}</option>`).join("");
      return `<section><h2>Replay</h2>
        <label>Workflow <select id="wf">${options}</select></label>
        <label>Healing for this workflow <select id="wf-heal">
          <option value="" ${mode === "" ? "selected" : ""}>Use the global setting (${esc(globalHeal)})</option>
          <option value="auto" ${mode === "auto" ? "selected" : ""}>Auto self-heal</option>
          <option value="approve" ${mode === "approve" ? "selected" : ""}>Approve before applying</option>
        </select></label>
        <form id="args"></form>
        <button class="primary" id="run" type="button">Run</button>
        <div id="live">${lastRun ? renderRun(lastRun) : ""}</div>
      </section>`;
    }

    function initials(name) {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      return (parts[0] || "?").slice(0, 2).toUpperCase();
    }

    function preferredDirectory(profiles) {
      let best = null;
      for (const profile of profiles || []) {
        if (!best || profile.matching > best.matching || (profile.matching === best.matching && profile.willImport > best.willImport)) best = profile;
      }
      return best ? best.directory : "";
    }

    function chosenProfile() {
      const profiles = (login.preview && login.preview.profiles) || [];
      return profiles.find((profile) => profile.directory === login.selected) || profiles[0] || null;
    }

    function loginAct() {
      const preview = login.preview;
      const chosen = chosenProfile();
      if (!preview || !chosen) return "";
      const host = preview.host || "this site";
      return `<section id="act-bar" data-ask="import">
        <p class="kicker">You need to act · import ${esc(host)}</p>
        <p class="instruction">Import ${esc(chosen.name)} for ${esc(host)}. Bao reads only this site.</p>
        <div class="row"><button class="primary" id="import-selected" type="button">Import from ${esc(chosen.name)}</button></div>
      </section>`;
    }

    function savedLogins() {
      const sites = login.saved || [];
      if (!sites.length) return `<div class="card" id="saved-logins"><h3>Saved sites</h3><p class="quiet">No sites yet. Import one to keep it here.</p></div>`;
      const rows = sites.map((site) => {
        const badge = site.signedIn === true
          ? `<span class="status passed">Live</span>`
          : site.signedIn === false
            ? `<span class="status paused">Needs sign-in</span>`
            : `<span class="status unchecked">Not checked</span>`;
        const when = site.lastProbeAt ? `Last checked ${esc(formatWhen(site.lastProbeAt))}` : "Not checked yet";
        return `<div class="row saved-row" data-saved-origin="${esc(site.origin)}">
          <strong>${esc(site.origin)}</strong>
          ${badge}
          <span class="quiet">${when}</span>
          <button type="button" data-recheck="${esc(site.origin)}">Re-check</button>
          <button type="button" data-remove="${esc(site.origin)}">Remove</button>
        </div>`;
      }).join("");
      return `<div class="card" id="saved-logins"><h3>Saved sites</h3>${rows}</div>`;
    }

    function formatWhen(at) {
      try {
        return new Date(at).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      } catch {
        return "";
      }
    }

    function logins() {
      const preview = login.preview;
      const profiles = preview && preview.profiles ? preview.profiles.map((profile) => {
        const on = profile.directory === login.selected;
        const avatar = profile.avatarDataUrl
          ? `<img alt="" src="${esc(profile.avatarDataUrl)}">`
          : `<div class="avatar">${esc(initials(profile.name))}</div>`;
        const bot = profile.botManager ? `<div class="meta">${profile.botManager} anti-bot ${profile.botManager === 1 ? "cookie" : "cookies"} skipped</div>` : "";
        const expired = profile.expired ? `<div class="meta">${profile.expired} expired left behind</div>` : "";
        const storage = `<div class="meta">${profile.localStorageItems || 0} localStorage ${(profile.localStorageItems || 0) === 1 ? "item" : "items"} · ${profile.indexedDbOrigins || 0} IndexedDB ${(profile.indexedDbOrigins || 0) === 1 ? "origin" : "origins"}</div>`;
        return `<button type="button" class="profile${on ? " on" : ""}" data-import-profile="${esc(profile.directory)}" aria-pressed="${on ? "true" : "false"}">
          ${avatar}
          <span><strong>${esc(profile.name)}</strong><div class="email">${esc(profile.email || "No account email")}</div>
          <div class="meta">${profile.matching} ${profile.matching === 1 ? "cookie matches" : "cookies match"} this site · will import ${profile.willImport}</div>
          ${storage}${bot}${expired}</span>
        </button>`;
      }).join("") : "";
      const note = preview && preview.keychainNote ? `<div class="notice"><strong>${esc(preview.keychainNote.title)}</strong><div>${esc(preview.keychainNote.body)}</div></div>` : "";
      const missing = preview && preview.chromeFound === false ? `<p>Bao did not find Chrome's Local State. Nothing was read.</p>` : "";
      const empty = preview && preview.chromeFound && profiles === "" ? `<p>Chrome has no profiles in Local State.</p>` : "";
      const report = login.report ? renderLoginReport(login.report) : "";
      const error = login.error ? `<div class="notice"><strong>Import</strong><div>${esc(login.error)}</div></div>` : "";
      return `<section><h2>Logins</h2>
        <p class="lede">Name a site, then import its login from your Chrome. Bao reads that site only, and only after this click. Values are not shown.</p>
        ${savedLogins()}
        <div class="card">
          <label>Site <input id="login-site" value="${esc(login.site)}" placeholder="https://www.example.com/account"></label>
          <details id="login-advanced" ${login.advancedOpen ? "open" : ""}>
            <summary>Advanced</summary>
            <p class="hint">A blank probe uses the page in Site. With no selector and no text, Bao checks whether that page landed on a login URL. Extra origins must be the same host. Anti-bot cookies are skipped unless you include them here.</p>
            <label>Probe URL <input id="login-probe" value="${esc(login.probeUrl)}" placeholder="Page that redirects to login when signed out"></label>
            <label>Same-host origins <input id="login-origins" value="${esc(login.origins)}" placeholder="Optional. https://app.example.com"></label>
            <label>Signed-in selector <input id="login-selector" value="${esc(login.selector)}" placeholder="Optional. Example: #account"></label>
            <label>Signed-in text <input id="login-text" value="${esc(login.text)}" placeholder="Optional. Example: Welcome back"></label>
            <label>Anti-bot cookies <select id="login-bots">
              <option value="skip" ${login.botCookies === "skip" ? "selected" : ""}>Skip (default)</option>
              <option value="include" ${login.botCookies === "include" ? "selected" : ""}>Include for this site</option>
            </select></label>
          </details>
          <div class="row"><button class="primary" id="show-profiles" type="button">Import this site's login from my Chrome</button></div>
        </div>
        ${error}${note}${missing}${empty}
        <div class="profiles">${profiles}</div>
        ${report}
      </section>`;
    }

    function renderLoginReport(report) {
      const tone = report.signedIn ? "pass" : "fail";
      const keychain = report.keychain ? `<div class="notice"><strong>${esc(report.keychain.title)}</strong><div>${esc(report.keychain.body)}</div></div>` : "";
      const rejected = (report.rejected || []).map((item) => `<div>${esc(item.name)} · ${esc(item.reason)}</div>`).join("");
      const failed = (report.failed || []).map((item) => `<div>${esc(item.name)} · ${esc(item.reason)}</div>`).join("");
      const signIn = report.offerSignIn ? `<button id="sign-in-once" type="button">Sign in once in Bao's window</button>` : "";
      return `<div class="card result" id="login-result"><h3 class="${tone}">${esc(report.headline)}</h3><p>${esc(report.message || "")}</p>${keychain}${rejected}${failed}<div class="row">${signIn}</div></div>`;
    }

    function settings() {
      const heal = state.settings.heal || "auto";
      const theme = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
      return `<section><h2>Settings</h2>
        <label>Appearance <select id="theme">
          <option value="light" ${theme === "light" ? "selected" : ""}>Light</option>
          <option value="dark" ${theme === "dark" ? "selected" : ""}>Dark</option>
        </select></label>
        <label>When a step misses <select id="heal">
          <option value="auto" ${heal === "auto" ? "selected" : ""}>Auto self-heal</option>
          <option value="approve" ${heal === "approve" ? "selected" : ""}>Approve before applying</option>
        </select></label>
        <p class="hint">Auto is the default. Healing runs only when a model key is set, or when this build is started with the fixture healer for a demo. Otherwise replay stops on the failed step.</p>
        <button id="save-settings" type="button">Save</button></section>`;
    }

    function notices() {
      const items = banner ? [banner, ...(state.notices || [])] : (state.notices || []);
      return items.map((n) => `<div class="notice" data-notice="${esc(n.title)}"><strong>${esc(n.title)}</strong><div>${esc(n.body)}</div></div>`).join("");
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    function bind() {
      const start = document.getElementById("start");
      if (start) start.onclick = async () => {
        await fetch("/api/sessions", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ url: document.getElementById("start-url").value }) });
        refresh();
      };
      const stop = document.getElementById("stop");
      if (stop) stop.onclick = async () => { await fetch("/api/sessions/stop", { method: "POST" }); refresh(); };
      const load = document.getElementById("load-trail");
      if (load) load.onclick = async () => {
        const id = document.getElementById("trail-id").value;
        const trail = await (await fetch("/api/trails/" + encodeURIComponent(id))).json();
        document.getElementById("trail-view").textContent = JSON.stringify(trail, null, 2);
      };
      document.querySelectorAll("[data-rename]").forEach((btn) => btn.onclick = async () => {
        const name = prompt("Name");
        if (!name) return;
        await fetch("/api/workflows/" + btn.dataset.rename, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ name }) });
        refresh();
      });
      document.querySelectorAll("[data-delete]").forEach((btn) => btn.onclick = async () => {
        if (!confirm("Delete this workflow?")) return;
        await fetch("/api/workflows/" + btn.dataset.delete, { method: "DELETE", headers: { "content-type": "application/json" }, body: JSON.stringify({ confirm: true }) });
        refresh();
      });
      document.querySelectorAll("[data-export]").forEach((btn) => btn.onclick = async () => {
        const doc = await (await fetch("/api/workflows/" + btn.dataset.export)).json();
        document.getElementById("import-json").value = JSON.stringify(doc, null, 2);
      });
      document.querySelectorAll("[data-open]").forEach((btn) => btn.onclick = () => openEditor(btn.dataset.open));
      const imp = document.getElementById("import");
      if (imp) imp.onclick = async () => {
        await fetch("/api/workflows/import", { method: "POST", headers: { "content-type": "application/json" }, body: document.getElementById("import-json").value });
        refresh();
      };
      const wf = document.getElementById("wf");
      if (wf) {
        wf.onchange = () => { lastWf = wf.value; refresh(); };
        if (wf.value) fillArgs(wf.value);
      }
      const wfHeal = document.getElementById("wf-heal");
      if (wfHeal) wfHeal.onchange = async () => {
        const id = document.getElementById("wf").value;
        const heal = wfHeal.value || null;
        await fetch("/api/workflows/" + encodeURIComponent(id), {
          method: "PATCH",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ heal }),
        });
        refresh();
      };
      const run = document.getElementById("run");
      if (run) run.onclick = runReplay;
      const runSign = document.getElementById("run-sign-in");
      if (runSign && lastRun && lastRun.signInUrl) runSign.onclick = () => signInOnce(lastRun.signInUrl);
      document.querySelectorAll("[data-keep]").forEach((btn) => btn.onclick = () => decideHeal(btn.dataset.keep, "keep"));
      document.querySelectorAll("[data-revert]").forEach((btn) => btn.onclick = () => decideHeal(btn.dataset.revert, "revert"));
      const save = document.getElementById("save-settings");
      if (save) save.onclick = async () => {
        await fetch("/api/settings", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ heal: document.getElementById("heal").value }) });
        refresh();
      };
      const theme = document.getElementById("theme");
      if (theme) theme.onchange = () => applyTheme(theme.value);
      bindLogins();
    }

    function readLoginForm() {
      const site = document.getElementById("login-site");
      if (!site) return;
      login.site = site.value.trim();
      const advanced = document.getElementById("login-advanced");
      login.advancedOpen = Boolean(advanced && advanced.open);
      login.probeUrl = document.getElementById("login-probe").value.trim();
      login.selector = document.getElementById("login-selector").value.trim();
      login.text = document.getElementById("login-text").value.trim();
      login.origins = document.getElementById("login-origins").value.trim();
      login.botCookies = document.getElementById("login-bots").value;
    }

    function loginPayload() {
      return {
        site: login.site,
        consent: true,
        probeUrl: login.probeUrl,
        signedInSelector: login.selector,
        signedInText: login.text,
        origins: login.origins,
        botCookies: login.botCookies,
      };
    }

    function bindLogins() {
      const show = document.getElementById("show-profiles");
      if (show) show.onclick = async () => {
        readLoginForm();
        login.error = "";
        login.report = null;
        const res = await fetch("/api/login-import/preview", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(loginPayload()) });
        const body = await res.json();
        await loadSaved();
        if (!res.ok) { login.error = body.error || "Import failed"; login.preview = null; login.selected = ""; render(); return; }
        login.preview = body;
        const profiles = body.profiles || [];
        login.selected = profiles.some((profile) => profile.directory === body.preferred) ? body.preferred : preferredDirectory(profiles);
        render();
      };
      document.querySelectorAll("[data-import-profile]").forEach((btn) => btn.onclick = () => {
        readLoginForm();
        login.selected = btn.dataset.importProfile;
        render();
      });
      const go = document.getElementById("import-selected");
      if (go) go.onclick = async () => {
        readLoginForm();
        if (!login.selected) return;
        login.error = "";
        go.disabled = true;
        const res = await fetch("/api/login-import", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ ...loginPayload(), profile: login.selected }),
        });
        const body = await res.json();
        await loadSaved();
        if (!res.ok) { login.error = body.error || "Import failed"; render(); return; }
        login.report = body;
        render();
      };
      document.querySelectorAll("[data-recheck]").forEach((btn) => btn.onclick = async () => {
        readLoginForm();
        btn.disabled = true;
        btn.textContent = "Checking…";
        const res = await fetch("/api/login-sites/recheck", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ origin: btn.dataset.recheck }),
        });
        const body = await res.json();
        if (!res.ok) login.error = body.error || "Re-check failed";
        await loadSaved();
        render();
      });
      document.querySelectorAll("[data-remove]").forEach((btn) => btn.onclick = async () => {
        readLoginForm();
        await fetch("/api/login-sites", {
          method: "DELETE",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ origin: btn.dataset.remove }),
        });
        await loadSaved();
        render();
      });
      const once = document.getElementById("sign-in-once");
      if (once) once.onclick = () => signInOnce();
    }

    async function signInOnce(url) {
      if (document.getElementById("login-site")) readLoginForm();
      const payload = url ? { site: url, consent: true, probeUrl: url } : loginPayload();
      const res = await fetch("/api/login-import/sign-in", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
      const body = await res.json();
      if (!res.ok) { login.error = body.error || "Could not open Bao's window"; render(); }
    }

    async function openEditor(id) {
      const doc = await (await fetch("/api/workflows/" + id)).json();
      document.getElementById("editor").innerHTML = `<div class="card"><h3>Edit ${doc.name}</h3><textarea id="edit-json" rows="16">${JSON.stringify(doc, null, 2)}</textarea><button id="save-edit" type="button">Save steps</button></div>`;
      document.getElementById("save-edit").onclick = async () => {
        const workflow = JSON.parse(document.getElementById("edit-json").value);
        await fetch("/api/workflows/" + id, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ workflow }) });
        refresh();
      };
    }

    async function fillArgs(id) {
      const doc = await (await fetch("/api/workflows/" + id)).json();
      const form = document.getElementById("args");
      form.innerHTML = doc.inputs.map((input) => field(input)).join("") || "<p>This workflow has no inputs.</p>";
      form.querySelectorAll(".drop").forEach((zone) => {
        zone.ondragover = (event) => { event.preventDefault(); zone.classList.add("over"); };
        zone.ondragleave = () => zone.classList.remove("over");
        zone.ondrop = (event) => {
          event.preventDefault();
          zone.classList.remove("over");
          const file = event.dataTransfer.files[0];
          zone.querySelector("input").files = event.dataTransfer.files;
          zone.querySelector("span").textContent = file ? file.name : "";
        };
      });
    }

    function field(input) {
      if (input.type === "secret") return `<label>${input.label || input.name} <input name="${input.name}" type="password" autocomplete="off"></label>`;
      if (input.type === "number") return `<label>${input.label || input.name} <input name="${input.name}" type="number" value="${input.default || ""}"></label>`;
      if (input.type === "choice") {
        const opts = (input.choices || []).map((c) => `<option>${c}</option>`).join("");
        return `<label>${input.label || input.name} <select name="${input.name}">${opts}</select></label>`;
      }
      if (input.type === "file") return `<label class="drop">${input.label || input.name} <input name="${input.name}" type="file" ${input.multiple ? "multiple" : ""}> <span>Drop a file here, or choose one.</span></label>`;
      return `<label>${input.label || input.name} <textarea name="${input.name}" rows="2">${input.default || ""}</textarea></label>`;
    }

    function renderRun(run) {
      if (run.status === "needs-sign-in") {
        return `<div class="row fail" id="run-status"><strong>Needs sign-in</strong></div><p>${esc(run.message || "")}</p><button id="run-sign-in" type="button">Sign in once in Bao's window</button>`;
      }
      const healed = (run.heals || []).length > 0;
      const lines = (run.steps || []).map((step) => `<div class="${esc(step.status)}">${esc(step.id)} ${esc(step.status)} ${esc(step.reason || "")}</div>`).join("");
      const heals = (run.heals || []).map((item) => reviewHeal(run, item)).join("");
      const failure = run.failure ? `<pre>${esc(JSON.stringify(publicFailure(run.failure), null, 2))}</pre>` : "";
      return `<div class="row ${esc(run.status)}" id="run-status"><strong>${esc(run.status)}</strong> ${healed ? '<span class="badge" id="run-heal-badge">healed</span>' : ""}</div>${lines}${heals}${failure}`;
    }

    function reviewHeal(run, item) {
      const shot = item.snapshot && item.snapshot.screenshot;
      const img = shot ? `<img alt="Snapshot sent with the heal" src="data:image/png;base64,${shot}" style="max-width:100%; max-height:140px; object-fit:contain; border:1px solid var(--line)">` : "";
      const audit = {
        intent: item.intent,
        model: item.model,
        prompt: item.prompt,
        rawResponse: item.rawResponse,
        proposedPatch: item.proposedPatch,
        executed: item.executed,
        postconditionPassed: item.postconditionPassed,
        snapshot: item.snapshot ? { screenshotRef: item.snapshot.screenshotRef, dom: item.snapshot.dom, ax: item.snapshot.ax } : undefined,
      };
      return `<div class="notice">
        <div class="row"><span class="badge">heal</span> <span>${esc(item.intent || "")}</span></div>
        <div>model ${esc(item.model && item.model.name)} version ${esc(item.model && item.model.version)} · postcondition ${esc(item.postconditionPassed === undefined ? "waiting" : item.postconditionPassed)}</div>
        <div class="row">
          <button type="button" data-keep="${esc(item.id)}">Keep patch</button>
          <button type="button" data-revert="${esc(item.id)}">Revert</button>
        </div>
        ${img}
        <pre style="max-height:9rem; overflow:auto">${esc(JSON.stringify(audit, null, 2))}</pre>
      </div>`;
    }

    function publicFailure(failure) {
      if (!failure || !failure.snapshot) return failure;
      const snap = failure.snapshot;
      return { ...failure, snapshot: { screenshotRef: snap.screenshotRef, dom: snap.dom, ax: snap.ax } };
    }

    async function decideHeal(healId, decision) {
      if (!lastRun) return;
      const item = (lastRun.heals || []).find((heal) => heal.id === healId);
      if (!item) return;
      const id = document.getElementById("wf").value;
      if (decision === "keep") {
        await fetch("/api/heal/keep", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ id, stepId: item.failedStep.id, patch: item.proposedPatch, runId: lastRun.runId, healId }),
        });
      } else {
        await fetch("/api/heal/revert", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ id, runId: lastRun.runId, healId }),
        });
      }
      banner = {
        title: decision === "keep" ? "Patch kept" : "Patch reverted",
        body: decision === "keep" ? "Kept the heal in the saved workflow." : "Reverted the saved workflow to the failed step.",
      };
      refresh();
    }

    async function runReplay() {
      const id = document.getElementById("wf").value;
      lastWf = id;
      const form = document.getElementById("args");
      const args = {};
      for (const el of form.querySelectorAll("[name]")) {
        if (el.type === "file") {
          const file = el.files[0];
          if (!file) continue;
          const bytes = new Uint8Array(await file.arrayBuffer());
          let bin = "";
          for (const b of bytes) bin += String.fromCharCode(b);
          args[el.name] = { name: file.name, base64: btoa(bin) };
        } else if (el.type === "number") args[el.name] = Number(el.value);
        else args[el.name] = el.value;
      }
      document.getElementById("live").textContent = "Running…";
      const res = await fetch("/api/replay", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, args }) });
      lastRun = await res.json();
      refresh();
    }

    document.querySelectorAll("#rail nav button").forEach((btn) => btn.onclick = () => { screen = btn.dataset.screen; refresh(); });
    document.getElementById("theme-toggle").onclick = () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    refresh();
  </script>
</body>
</html>
