<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Bao</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --side: #ececef;
      --card: #ffffff;
      --ink: #1d1d1f;
      --quiet: #6e6e73;
      --line: #d2d2d7;
      --accent: #0071e3;
      --select: #e8e8ed;
      --ok: #248a3d;
      --ok-bg: #e7f6ec;
      --heal: #0a7ea4;
      --heal-bg: #e5f4f8;
      --prov: #8a5a00;
      --prov-bg: #fff4d6;
      --need: #c93400;
      --need-bg: #fff1e8;
      --bad: #d70015;
      --bad-bg: #fdecea;
      --warn-bg: #fff6e0;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      --radius: 12px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --text-xs: 11px;
      --text-sm: 12px;
      --text-md: 13px;
      --text-lg: 15px;
      --text-xl: 22px;
      --text-2xl: 28px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1c1e;
      --side: #2c2c2e;
      --card: #2c2c2e;
      --ink: #f5f5f7;
      --quiet: #98989d;
      --line: #3a3a3c;
      --accent: #0a84ff;
      --select: #3a3a3c;
      --ok: #30d158;
      --ok-bg: #16301f;
      --heal: #64d2ff;
      --heal-bg: #0e2a33;
      --prov: #ffd60a;
      --prov-bg: #332b0d;
      --need: #ff9f0a;
      --need-bg: #33240d;
      --bad: #ff453a;
      --bad-bg: #3a1614;
      --warn-bg: #33280f;
      --shadow: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font: var(--text-md)/1.45 var(--font);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.32rem 0.7rem;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button.link { border: 0; background: transparent; padding: 0; color: var(--accent); }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    h2, h3, h4 { font-weight: 650; letter-spacing: -0.02em; }
    h2 { font-size: var(--text-2xl); margin: 0 0 0.35rem; }
    h3 { font-size: var(--text-lg); margin: 0.2rem 0; }
    .lede { color: var(--quiet); margin: 0 0 var(--space-4); }
    .quiet { color: var(--quiet); }
    #app { display: grid; grid-template-columns: 216px 1fr; min-height: 100vh; }
    #rail {
      background: var(--side);
      padding: var(--space-4) var(--space-3);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      border-right: 1px solid var(--line);
    }
    #rail .brand { display: flex; align-items: center; justify-content: space-between; padding: 0.2rem 0.45rem 0.7rem; font-size: var(--text-lg); }
    #rail nav { display: flex; flex-direction: column; gap: 2px; }
    #rail nav button {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      text-align: left;
      background: transparent;
      border-color: transparent;
      border-radius: 8px;
      padding: 0.4rem 0.5rem;
    }
    #rail nav button.on { background: var(--card); box-shadow: var(--shadow); }
    .ico { width: 16px; height: 16px; flex: none; }
    .rail-foot { margin-top: auto; padding: 0.7rem 0.45rem 0.2rem; color: var(--quiet); display: grid; gap: 0.3rem; font-size: var(--text-sm); }
    .channel { display: flex; align-items: center; gap: 0.4rem; }
    .count {
      min-width: 1.15rem;
      text-align: center;
      background: var(--need);
      color: white;
      border-radius: 999px;
      font-size: var(--text-xs);
      padding: 0 0.35rem;
    }
    .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #c7c7cc; display: inline-block; }
    .dot.on { background: #ff3b30; }
    #content { min-width: 0; }
    #act { padding: var(--space-4) var(--space-5) 0; }
    #onboard { padding: 0 var(--space-5); }
    #main { padding: var(--space-3) var(--space-5) 4rem; }
    .card, .why, #heal-detail, #run-viewer, .wf-card, .step-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      margin: 0.55rem 0;
      box-shadow: var(--shadow);
    }
    #act-bar {
      background: var(--need-bg);
      border: 1px solid var(--need);
      border-left: 4px solid var(--need);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      margin-bottom: 0.35rem;
    }
    #act-bar .kicker { margin: 0; font-weight: 700; color: var(--need); font-size: var(--text-sm); letter-spacing: 0.01em; }
    #act-bar .instruction { margin: 0.3rem 0; font-size: 17px; font-weight: 650; letter-spacing: -0.02em; }
    #act-bar .timeout { margin: 0.1rem 0 0.5rem; color: var(--quiet); }
    label { display: grid; gap: 0.25rem; margin: 0.5rem 0; }
    input, select, textarea {
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      width: 100%;
    }
    .row { display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap; }
    .tools { display: flex; gap: var(--space-2); align-items: center; margin: 0 0 var(--space-4); }
    .tools input { max-width: 420px; }
    .kbd {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--quiet);
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      font-size: var(--text-sm);
    }
    .drop { outline: 1px dashed var(--line); border-radius: 10px; padding: 0.7rem; background: var(--bg); }
    .drop.over { outline-color: var(--accent); }
    .pass, .passed { color: var(--ok); }
    .fail, .failed { color: var(--bad); }
    .paused { color: var(--need); }
    .healed { color: var(--heal); }
    .provisional { color: var(--prov); }
    .badge, .status {
      display: inline-block;
      border-radius: 999px;
      padding: 0.05rem 0.5rem;
      font-size: var(--text-xs);
      font-weight: 650;
    }
    .badge { background: var(--ink); color: var(--bg); }
    .quiet-badge { background: var(--select); color: var(--ink); }
    .status.passed { background: var(--ok-bg); color: var(--ok); }
    .status.failed { background: var(--bad-bg); color: var(--bad); }
    .status.paused { background: var(--need-bg); color: var(--need); }
    .status.healed { background: var(--heal-bg); color: var(--heal); }
    .status.provisional { background: var(--prov-bg); color: var(--prov); }
    .badge.expect { background: var(--heal-bg); color: var(--heal); }
    .badge.need { background: var(--need-bg); color: var(--need); }
    .notice { background: var(--warn-bg); border: 1px solid var(--line); border-radius: 10px; padding: 0.6rem 0.75rem; margin: 0.4rem 0; }
    pre { white-space: pre-wrap; font: var(--text-sm)/1.45 var(--mono); }
    table.grid, table.identity, #pass-grid { width: 100%; border-collapse: collapse; }
    table.grid th, table.grid td, table.identity th, table.identity td, #pass-grid th, #pass-grid td {
      text-align: left;
      padding: 0.4rem 0.45rem;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    .wf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-3); }
    .wf-card { display: grid; grid-template-columns: 104px 1fr; gap: var(--space-3); margin: 0; }
    .thumb {
      height: 76px;
      border-radius: 10px;
      background: var(--select);
      overflow: hidden;
      display: grid;
      place-items: end start;
      padding: 6px;
      color: var(--quiet);
      font-size: var(--text-xs);
      position: relative;
    }
    .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .spark { display: flex; gap: 3px; height: 16px; align-items: flex-end; margin: 0.35rem 0; }
    .spark i { width: 6px; border-radius: 2px; display: block; background: var(--line); }
    .spark i.passed, .spark i.healed { height: 16px; background: var(--ok); }
    .spark i.healed { background: var(--heal); }
    .spark i.failed { height: 8px; background: var(--bad); }
    .spark i.paused { height: 12px; background: var(--need); }
    .spark i.provisional { height: 14px; background: var(--prov); }
    .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 0.35rem; }
    .chip { background: var(--select); border-radius: 999px; padding: 0.05rem 0.45rem; font-size: var(--text-xs); }
    .chip.secret { background: var(--prov-bg); color: var(--prov); }
    .chip.id-chip { font-family: var(--mono); }
    .step-card { display: grid; grid-template-columns: 88px 1fr; gap: var(--space-3); }
    .step-card.human { border-color: var(--need); background: var(--need-bg); }
    .split { display: grid; grid-template-columns: 240px 1fr; gap: 0.9rem; }
    .step-list { display: flex; flex-direction: column; gap: 0.25rem; }
    .step { text-align: left; background: transparent; width: 100%; }
    .step.on { background: var(--select); }
    .step em { color: var(--quiet); font-style: normal; margin-left: 0.3rem; }
    .bar { display: flex; gap: 3px; align-items: center; margin: 0.7rem 0; }
    .seg { height: 8px; flex: 1; border-radius: 99px; background: var(--select); }
    .seg.passed { background: var(--ok); }
    .seg.failed { background: var(--bad); }
    .seg.paused { background: var(--need); }
    .bar-count { color: var(--quiet); margin-left: 0.4rem; }
    img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; }
    .compare { position: relative; }
    .compare img { display: block; width: 100%; height: auto; }
    .compare img + img { position: absolute; inset: 0; }
    .filmstrip { display: flex; gap: 6px; overflow: auto; padding: 0.3rem 0 0.5rem; }
    .frame { width: 96px; flex: none; padding: 4px; background: transparent; }
    .frame img, .frame span { display: grid; place-items: center; height: 52px; width: 100%; border-radius: 8px; background: var(--select); font-size: var(--text-xs); color: var(--quiet); overflow: hidden; }
    .frame.on { outline: 2px solid var(--accent); }
    #scrubber { width: 100%; accent-color: var(--accent); }
    .timeline { position: relative; height: 28px; margin: 0.4rem 0; background: var(--select); border-radius: 6px; }
    .marker { position: absolute; top: 2px; transform: translateX(-50%); min-width: 1.3rem; padding: 0.1rem 0.25rem; }
    .marker.failed { color: var(--bad); }
    .heal-row { display: block; width: 100%; text-align: left; margin: 0.3rem 0; }
    .cell { width: 12px; height: 12px; border-radius: 3px; display: inline-block; background: var(--select); }
    .cell.passed { background: var(--ok); }
    .cell.failed { background: var(--bad); }
    .cell.paused { background: var(--need); }
    .cell.healed { background: var(--heal); }
    .cell.empty { background: transparent; border: 1px solid var(--line); }
    details { margin: 0.45rem 0; }
    .empty { padding: 1.6rem 0.2rem; color: var(--quiet); }
    .empty strong { display: block; color: var(--ink); font-size: var(--text-lg); margin-bottom: 0.25rem; }
    #record-bar {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      display: flex;
      gap: 0.35rem;
      align-items: center;
      background: var(--ink);
      color: var(--bg);
      border-radius: 999px;
      padding: 0.4rem 0.45rem 0.4rem 0.85rem;
      z-index: 30;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
    }
    #record-bar button { background: transparent; color: inherit; border-color: transparent; }
    #record-bar button:hover { background: rgba(255, 255, 255, 0.12); }
    #rec-timer { font-variant-numeric: tabular-nums; min-width: 2.8rem; }
    .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; }
    #record-bar[data-paused="true"] .rec-dot { background: var(--need); }
    #onboarding { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 1rem 1.1rem; margin-top: var(--space-3); }
    .perms { list-style: none; padding: 0; margin: 0.6rem 0; display: grid; gap: 0.35rem; }
    .perm { display: flex; gap: 0.5rem; align-items: center; }
    .perm .mark { width: 1.1rem; text-align: center; }
    .perm[data-ok="true"] .mark::before { content: "✓"; color: var(--ok); font-weight: 700; }
    .perm[data-ok="false"] .mark::before { content: "○"; color: var(--quiet); }
    #palette { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.28); z-index: 40; display: grid; align-items: start; justify-content: center; padding-top: 12vh; }
    #palette[hidden] { display: none; }
    #palette .panel { width: min(520px, 92vw); background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18); }
    #palette input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 0.8rem 0.9rem; }
    #palette button.hit { display: flex; justify-content: space-between; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 0; padding: 0.55rem 0.9rem; }
    #palette button.hit.on { background: var(--select); }
    #live-step-list { margin: 0.4rem 0 0; padding-left: 1.2rem; }
    @media (max-width: 800px) {
      #app { grid-template-columns: 1fr; }
      .split, .wf-card, .step-card { grid-template-columns: 1fr; }
      #main, #act, #onboard { padding-left: var(--space-3); padding-right: var(--space-3); }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="rail"></aside>
    <div id="content">
      <div id="act"></div>
      <div id="onboard"></div>
      <main id="main"></main>
    </div>
  </div>
  <div id="float"></div>
  <div id="palette" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
