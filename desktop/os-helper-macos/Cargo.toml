[package]
name = "bao-os-macos"
version = "0.1.0"
edition = "2021"
description = "macOS Accessibility helper for the desktop OS plane. Throwaway apps only."
publish = false

[[bin]]
name = "bao-os-macos"
path = "src/main.rs"

[dependencies]
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics = "0.25"
foreign-types = "0.5"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["alloc", "NSArray", "NSString"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
