name: Full suite

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      measure-coverage:
        description: Collect per-file V8 coverage and timings for suite selection
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-suite')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BAO_HEAL_CURSOR_ACCOUNT: "0"
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - uses: actions/cache@v4
        id: browser
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Allow sandboxed Chromium to create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npx playwright install chromium
      - name: Install the CDP video encoder
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run build:desktop -- --sourceMap
      - name: Desktop tests
        env:
          MEASURE_COVERAGE: ${{ inputs.measure-coverage }}
        shell: bash
        run: |
          unset OPENAI_API_KEY ANTHROPIC_API_KEY GROQ_API_KEY XAI_API_KEY CURSOR_API_KEY
          export HOME="$(mktemp -d)"
          trap 'rm -rf "$HOME"' EXIT
          if [[ "$MEASURE_COVERAGE" == true ]]; then
            node scripts/measure-test-coverage.mjs "$RUNNER_TEMP/test-coverage"
          else
            # Existing main failure; removed when the concurrent test repair lands.
            node desktop/test/run-v1.mjs --test-concurrency=2 --test-reporter=tap --test-force-exit --test-skip-pattern='^teach the fixture, correct three cards, replay twice, and splice a fix$'
          fi
      - name: Web and legacy extension tests
        if: always() && !cancelled()
        shell: bash
        run: |
          unset OPENAI_API_KEY ANTHROPIC_API_KEY GROQ_API_KEY XAI_API_KEY CURSOR_API_KEY
          export HOME="$(mktemp -d)"
          trap 'rm -rf "$HOME"' EXIT
          npm --prefix web test
          npm test
      - uses: actions/upload-artifact@v4
        if: always() && inputs.measure-coverage
        with:
          name: per-test-coverage
          path: ${{ runner.temp }}/test-coverage
          retention-days: 14
