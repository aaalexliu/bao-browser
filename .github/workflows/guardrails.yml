name: Full suite

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      measure-coverage:
        description: Collect per-file V8 coverage and timings for suite selection
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The `full-suite` label runs desktop/test/unit in three shards side by side. A manual run does too.
  full-suite:
    name: full-suite (${{ matrix.shard }})
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'full-suite') && (github.event.action != 'labeled' || github.event.label.name == 'full-suite' || github.event.label.name == 'replay-suite'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    env:
      BAO_HEAL_CURSOR_ACCOUNT: "0"
      PLAYWRIGHT_BROWSERS_PATH: /tmp/bao-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-suite-setup
      - name: Desktop tests
        env:
          SHARD: ${{ matrix.shard }}
          MEASURE_COVERAGE: ${{ inputs.measure-coverage }}
        shell: bash
        run: |
          unset OPENAI_API_KEY ANTHROPIC_API_KEY GROQ_API_KEY XAI_API_KEY CURSOR_API_KEY
          HOME="$(mktemp -d)"
          export HOME
          trap 'rm -rf "$HOME"' EXIT
          if [[ "$MEASURE_COVERAGE" == true ]]; then
            xvfb-run -a node scripts/measure-test-coverage.mjs "$RUNNER_TEMP/test-coverage" unit "$SHARD"
          else
            xvfb-run -a node desktop/test/run-v1.mjs "--shard=$SHARD" --test-concurrency=2 --test-reporter=tap --test-force-exit
          fi
      - uses: actions/upload-artifact@v4
        if: always() && inputs.measure-coverage
        with:
          name: per-test-coverage-unit-${{ strategy.job-index }}
          path: ${{ runner.temp }}/test-coverage
          retention-days: 14

  # The `replay-suite` label runs desktop/test/replay, then web/: what the Replay switch gates. A manual run does too.
  replay-suite:
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'replay-suite') && (github.event.action != 'labeled' || github.event.label.name == 'full-suite' || github.event.label.name == 'replay-suite'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BAO_HEAL_CURSOR_ACCOUNT: "0"
      PLAYWRIGHT_BROWSERS_PATH: /tmp/bao-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-suite-setup
      - name: Desktop tests
        env:
          MEASURE_COVERAGE: ${{ inputs.measure-coverage }}
        shell: bash
        run: |
          unset OPENAI_API_KEY ANTHROPIC_API_KEY GROQ_API_KEY XAI_API_KEY CURSOR_API_KEY
          HOME="$(mktemp -d)"
          export HOME
          trap 'rm -rf "$HOME"' EXIT
          if [[ "$MEASURE_COVERAGE" == true ]]; then
            xvfb-run -a node scripts/measure-test-coverage.mjs "$RUNNER_TEMP/test-coverage" replay
          else
            xvfb-run -a node desktop/test/run-v1.mjs --lane=replay --test-concurrency=2 --test-reporter=tap --test-force-exit
          fi
      - name: Web tests
        if: always() && !cancelled()
        shell: bash
        run: |
          unset OPENAI_API_KEY ANTHROPIC_API_KEY GROQ_API_KEY XAI_API_KEY CURSOR_API_KEY
          HOME="$(mktemp -d)"
          export HOME
          trap 'rm -rf "$HOME"' EXIT
          npm --prefix web test
      - uses: actions/upload-artifact@v4
        if: always() && inputs.measure-coverage
        with:
          name: per-test-coverage-replay
          path: ${{ runner.temp }}/test-coverage
          retention-days: 14

  # A pull_request cache is scoped to that PR's merge ref, so one PR's deb
  # cache is invisible to the next. A push to main writes the shared cache.
  warm-chromium-deps:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root packages
        run: npm ci --ignore-scripts
      - name: Read Playwright version
        id: playwright
        run: |
          node -p '"version=" + require("playwright-core/package.json").version' >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
      - name: Install Chromium system dependencies
        timeout-minutes: 12
        uses: ./.github/actions/install-chromium-deps
        with:
          version: ${{ steps.playwright.outputs.version }}
          image: ${{ steps.playwright.outputs.image }}
