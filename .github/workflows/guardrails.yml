name: Full suite

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      measure-coverage:
        description: Collect per-file V8 coverage and timings for suite selection
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which lanes this event asks for. `full-suite` runs desktop/test/unit in three shards side by side,
  # `replay-suite` runs desktop/test/replay and web/. A manual run takes both. A label event that adds some other label runs nothing.
  plan:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-suite') || contains(github.event.pull_request.labels.*.name, 'replay-suite')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
    steps:
      - name: Pick lanes from the event and the labels
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        shell: bash
        run: |
          unit='[{"lane":"unit","shard":"1/3"},{"lane":"unit","shard":"2/3"},{"lane":"unit","shard":"3/3"}]'
          replay='[{"lane":"replay","shard":"1/1"}]'
          suites='[]'
          if [[ "$EVENT" == workflow_dispatch ]]; then
            suites="$(jq -cn --argjson unit "$unit" --argjson replay "$replay" '$unit + $replay')"
          elif [[ "$EVENT" == pull_request && ( "$ACTION" != labeled || "$ADDED" == full-suite || "$ADDED" == replay-suite ) ]]; then
            suites="$(jq -c --argjson unit "$unit" --argjson replay "$replay" '(if index("full-suite") then $unit else [] end) + (if index("replay-suite") then $replay else [] end)' <<<"$LABELS")"
          fi
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  suite:
    name: ${{ matrix.suite.lane == 'unit' && format('full-suite ({0})', matrix.suite.shard) || 'replay-suite' }}
    needs: plan
    if: needs.plan.outputs.suites != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    env:
      BAO_HEAL_CURSOR_ACCOUNT: "0"
      PLAYWRIGHT_BROWSERS_PATH: /tmp/bao-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Restore installed packages
        uses: actions/cache@v4
        id: packages
        with:
          path: |
            node_modules
            web/node_modules
          key: packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package.json', 'package-lock.json', 'web/package.json', 'web/package-lock.json') }}
      - name: Install packages on a cache miss
        if: steps.packages.outputs.cache-hit != 'true'
        run: npm ci
      - name: Read Playwright version
        id: playwright
        run: |
          node -p '"version=" + require("playwright-core/package.json").version' >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        uses: actions/cache@v4
        id: browser
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: chromium-${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}
      - name: Allow sandboxed Chromium to create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Download Chromium on a cache miss
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install Chromium system dependencies
        timeout-minutes: 12
        uses: ./.github/actions/install-chromium-deps
        with:
          version: ${{ steps.playwright.outputs.version }}
          image: ${{ steps.playwright.outputs.image }}
      - name: Set up the CDP video tools
        uses: ./.github/actions/setup-ffmpeg
      - run: npm run build:desktop -- --sourceMap
      - name: Desktop tests
        env:
          LANE: ${{ matrix.suite.lane }}
          SHARD: ${{ matrix.suite.shard }}
          MEASURE_COVERAGE: ${{ inputs.measure-coverage }}
        shell: bash
        run: |
          unset OPENAI_API_KEY ANTHROPIC_API_KEY GROQ_API_KEY XAI_API_KEY CURSOR_API_KEY
          HOME="$(mktemp -d)"
          export HOME
          trap 'rm -rf "$HOME"' EXIT
          if [[ "$MEASURE_COVERAGE" == true ]]; then
            xvfb-run -a node scripts/measure-test-coverage.mjs "$RUNNER_TEMP/test-coverage" "$LANE" "$SHARD"
          else
            xvfb-run -a node desktop/test/run-v1.mjs "--lane=$LANE" "--shard=$SHARD" --test-concurrency=2 --test-reporter=tap --test-force-exit
          fi
      - name: Web tests
        if: matrix.suite.lane == 'replay' && always() && !cancelled()
        shell: bash
        run: |
          unset OPENAI_API_KEY ANTHROPIC_API_KEY GROQ_API_KEY XAI_API_KEY CURSOR_API_KEY
          HOME="$(mktemp -d)"
          export HOME
          trap 'rm -rf "$HOME"' EXIT
          npm --prefix web test
      - uses: actions/upload-artifact@v4
        if: always() && inputs.measure-coverage
        with:
          name: per-test-coverage-${{ matrix.suite.lane }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/test-coverage
          retention-days: 14

  # A pull_request cache is scoped to that PR's merge ref, so one PR's deb
  # cache is invisible to the next. A push to main writes the shared cache.
  warm-chromium-deps:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root packages
        run: npm ci --ignore-scripts
      - name: Read Playwright version
        id: playwright
        run: |
          node -p '"version=" + require("playwright-core/package.json").version' >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
      - name: Install Chromium system dependencies
        timeout-minutes: 12
        uses: ./.github/actions/install-chromium-deps
        with:
          version: ${{ steps.playwright.outputs.version }}
          image: ${{ steps.playwright.outputs.image }}
