name: Guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
      BAO_HEAL_CURSOR_ACCOUNT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - name: Compare baseline budgets to the target branch or previous main commit
        env:
          BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run baselines:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run arch:check
      - run: npm run test:guardrails
      - run: npx playwright install --with-deps chromium
      - name: Hermetic desktop, web and legacy extension tests
        shell: bash
        run: |
          unset OPENAI_API_KEY ANTHROPIC_API_KEY GROQ_API_KEY XAI_API_KEY CURSOR_API_KEY
          export HOME="$(mktemp -d)"
          trap 'rm -rf "$HOME"' EXIT
          npm run build:desktop
          # Existing main failure, proof: docs/guardrails.md#known-existing-failure
          node desktop/test/run-v1.mjs --test-concurrency=2 --test-skip-pattern='^teach the fixture, correct three cards, replay twice, and splice a fix$'
          npm --prefix web test
          npm test
