name: Full suite

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      measure-coverage:
        description: Collect per-file V8 coverage and timings for suite selection
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'full-suite') && (github.event.action != 'labeled' || github.event.label.name == 'full-suite'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BAO_HEAL_CURSOR_ACCOUNT: "0"
      PLAYWRIGHT_BROWSERS_PATH: /tmp/bao-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Restore installed packages
        uses: actions/cache@v4
        id: packages
        with:
          path: |
            node_modules
            web/node_modules
          key: packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package.json', 'package-lock.json', 'web/package.json', 'web/package-lock.json') }}
      - name: Install packages on a cache miss
        if: steps.packages.outputs.cache-hit != 'true'
        shell: bash
        run: |
          npm ci & root=$!
          npm --prefix web ci & web=$!
          status=0
          wait "$root" || status=1
          wait "$web" || status=1
          exit "$status"
      - name: Read Playwright version
        id: playwright
        run: |
          node -p '"version=" + require("playwright-core/package.json").version' >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        uses: actions/cache@v4
        id: browser
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: chromium-${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}
      - name: Allow sandboxed Chromium to create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Download Chromium on a cache miss
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install Chromium system dependencies
        timeout-minutes: 12
        uses: ./.github/actions/install-chromium-deps
        with:
          version: ${{ steps.playwright.outputs.version }}
          image: ${{ steps.playwright.outputs.image }}
      - name: Set up the CDP video tools
        uses: ./.github/actions/setup-ffmpeg
      - run: npm run build:desktop -- --sourceMap
      - name: Desktop tests
        env:
          MEASURE_COVERAGE: ${{ inputs.measure-coverage }}
        shell: bash
        run: |
          unset OPENAI_API_KEY ANTHROPIC_API_KEY GROQ_API_KEY XAI_API_KEY CURSOR_API_KEY
          HOME="$(mktemp -d)"
          export HOME
          trap 'rm -rf "$HOME"' EXIT
          if [[ "$MEASURE_COVERAGE" == true ]]; then
            xvfb-run -a node scripts/measure-test-coverage.mjs "$RUNNER_TEMP/test-coverage"
          else
            xvfb-run -a node desktop/test/run-v1.mjs --test-concurrency=2 --test-reporter=tap --test-force-exit
          fi
      - name: Web tests
        if: always() && !cancelled()
        shell: bash
        run: |
          unset OPENAI_API_KEY ANTHROPIC_API_KEY GROQ_API_KEY XAI_API_KEY CURSOR_API_KEY
          HOME="$(mktemp -d)"
          export HOME
          trap 'rm -rf "$HOME"' EXIT
          npm --prefix web test
      - uses: actions/upload-artifact@v4
        if: always() && inputs.measure-coverage
        with:
          name: per-test-coverage
          path: ${{ runner.temp }}/test-coverage
          retention-days: 14

  # A pull_request cache is scoped to that PR's merge ref, so one PR's deb
  # cache is invisible to the next. A push to main writes the shared cache.
  warm-chromium-deps:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root packages
        run: npm ci
      - name: Read Playwright version
        id: playwright
        run: |
          node -p '"version=" + require("playwright-core/package.json").version' >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
      - name: Install Chromium system dependencies
        timeout-minutes: 12
        uses: ./.github/actions/install-chromium-deps
        with:
          version: ${{ steps.playwright.outputs.version }}
          image: ${{ steps.playwright.outputs.image }}
